<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chef Match – v0.5.1</title>
<style>
  html,body{margin:0;height:100%;background:#3b2418 url("assets/bg_terrace.jpg") center/cover no-repeat;overflow:hidden;touch-action:none;
    font-family:"Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
  canvas{display:block;margin:0 auto;touch-action:none}
  /* Écran de fin */
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(40,20,10,.6)}
  #overlay.show{display:flex}
  #panel{background:#fff4e0;border:4px solid #c8834a;border-radius:22px;padding:24px 28px;
    text-align:center;min-width:240px;box-shadow:0 10px 30px rgba(0,0,0,.4);color:#5a3220;
    animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  #panel h1{margin:0 0 6px;font-size:30px}
  #panel p{margin:4px 0 16px;font-size:16px;white-space:pre-line;max-width:280px}
  #panel button{display:block;width:100%;margin:8px 0;padding:12px;font-size:18px;font-weight:bold;
    border:none;border-radius:14px;cursor:pointer;color:#fff;background:#e0703a;box-shadow:0 4px 0 #a64a20}
  #panel button.alt{background:#7aa35a;box-shadow:0 4px 0 #4e7336}
  #panel button:active{transform:translateY(3px);box-shadow:none}
  /* Écran de sélection des niveaux + intro */
  .ecran{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;background:#3b2418;z-index:11;overflow:auto}
  .ecran.show{display:flex}
  #ecranNiveaux h1{color:#fff4e0;margin:22px 0 4px;font-size:28px}
  #ecranNiveaux .sous{color:#f1d3a5;margin-bottom:12px;font-size:14px}
  #grilleNiveaux{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(92vw,420px);padding-bottom:20px}
  .carteNiv{background:#fff4e0;border:3px solid #c8834a;border-radius:16px;padding:10px;text-align:left;color:#5a3220;cursor:pointer;font-family:inherit}
  .carteNiv b{font-size:17px}.carteNiv .obj{font-size:20px;margin:4px 0}.carteNiv .best{font-size:12px}
  .carteNiv.verrou{background:#7a5a48;border-color:#5a3c2c;color:#c9b29e;cursor:not-allowed}
  .carteNiv.gagne{border-color:#7aa35a}
  #btnNiveaux{position:fixed;left:8px;bottom:8px;z-index:3;border:none;border-radius:12px;padding:8px 12px;background:#c8834a;color:#fff;font-weight:bold;font-family:inherit;cursor:pointer}
  #intro{justify-content:center;background:rgba(40,20,10,.88);cursor:pointer;z-index:12}
  #bulle{background:#fff4e0;border:4px solid #c8834a;border-radius:22px;padding:20px 22px;max-width:320px;color:#5a3220;font-size:18px;line-height:1.4;position:relative;animation:pop .3s ease-out}
  #bulle:after{content:"";position:absolute;left:40px;bottom:-18px;border:10px solid transparent;border-top-color:#c8834a}
  #introAide{color:#f1d3a5;margin-top:22px;font-size:13px}
  #btnPasser{position:fixed;right:12px;bottom:12px;border:none;border-radius:12px;padding:10px 16px;background:#e0703a;color:#fff;font-weight:bold;font-family:inherit;cursor:pointer}
  /* Écran de rénovation (v0.3.2, visuels provisoires) */
  #btnRenover{position:fixed;left:108px;bottom:8px;z-index:3;border:none;border-radius:12px;padding:8px 12px;background:#7aa35a;color:#fff;font-weight:bold;font-family:inherit;cursor:pointer}
  #badgeRenover{display:none;position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;border-radius:10px;background:#e2483d;color:#fff;font-size:12px;line-height:20px;text-align:center;border:2px solid #fff;animation:pop .4s ease-out}
  #badgeRenover.on{display:block}
  #ecranRenovation{background:#3b2418;z-index:12}
  #renoTete{display:flex;align-items:center;justify-content:space-between;width:min(94vw,440px);color:#fff4e0;font-weight:bold;font-size:20px;margin:12px 0 8px}
  #renoEtoiles{background:#fff4e0;color:#5a3220;border-radius:14px;padding:4px 12px}
  #renoFermer{border:none;background:#c8834a;color:#fff;border-radius:10px;font-size:18px;padding:4px 10px;cursor:pointer}
  #renoScene{position:relative;height:min(58vh,540px);aspect-ratio:9/16;max-width:94vw;border-radius:18px;border:4px solid #c8834a;overflow:hidden;
    background:#6b8fb3}
  #renoScene .couche{position:absolute;inset:0;background:center/cover no-repeat}
  #renoApres{transition:opacity 1.4s ease-in-out}
  #renoScene img.overlay{position:absolute;aspect-ratio:9/16;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
  #renoScene img.overlay.nouveau{animation:fondu 1.2s ease-out}
  @keyframes fondu{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  #renoEclat{position:absolute;left:50%;top:45%;font-size:64px;transform:translate(-50%,-50%) scale(0);pointer-events:none}
  #renoEclat.go{animation:eclat 1s ease-out}
  @keyframes eclat{0%{transform:translate(-50%,-50%) scale(0);opacity:1}60%{transform:translate(-50%,-50%) scale(1.6);opacity:1}100%{transform:translate(-50%,-50%) scale(2);opacity:0}}
  #renoScene .elt{position:absolute;transform:translate(-50%,-50%);font-size:44px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
  #renoScene .elt.vide{opacity:.28;filter:grayscale(1)}
  #renoScene .elt.nouveau{animation:apparition .9s ease-out}
  @keyframes apparition{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg)}60%{transform:translate(-50%,-50%) scale(1.5)}100%{transform:translate(-50%,-50%) scale(1)}}
  #renoBarre{position:absolute;left:10px;right:10px;bottom:8px;height:10px;background:rgba(255,244,224,.6);border-radius:5px}
  #renoProgres{height:100%;width:0;background:#7aa35a;border-radius:5px;transition:width .6s}
  #renoListe{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(94vw,440px);margin-top:10px}
  .tache{background:#fff4e0;border:3px solid #c8834a;border-radius:14px;padding:8px;color:#5a3220;font-family:inherit;font-size:14px;text-align:left;cursor:pointer}
  .tache b{display:block}.tache.faite{background:#dfe9d3;border-color:#7aa35a;cursor:default}
  .tache.cher{opacity:.6;cursor:not-allowed}.tache.ok{box-shadow:0 0 0 3px #ffd56b}
  #renoSuivant{color:#f1d3a5;margin:10px 0 4px;font-size:14px;text-align:center;width:min(94vw,440px)}
  #renoBulle{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff4e0;border:4px solid #c8834a;border-radius:20px;

  #renoBulle.show{display:block}
  #renoBulle{z-index:6}
  #renoFinale{display:none;position:fixed;inset:0;z-index:5;background:radial-gradient(circle at 50% 40%,rgba(255,226,170,.35),rgba(30,15,8,.88));align-items:flex-start;justify-content:center}

  #renoBulle small{display:block;opacity:.6;margin-top:6px;font-size:11px}
  /* v0.4-dev : solde, boutique, pré-niveau */

  .solde.pulse{animation:pop .5s ease-out}

  .portraitBulle{float:left;width:54px;height:54px;object-fit:cover;border-radius:50%;margin:0 8px 2px 0;border:2px solid #e0703a;background:#fff4e0}

  #renoTete{flex-wrap:wrap;row-gap:4px}

  #ecranDeco{background:#3b2418;z-index:14;color:#fff4e0;overflow:auto}
  #decoMsg{margin:6px 12px;font-size:13px}

  .decoStyles{display:flex;gap:6px;margin-top:6px}
  .decoStyle{flex:1;border:2px solid #e0c9a8;border-radius:10px;background:#fff;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:#5a3220;cursor:pointer}

  #soldeFin{margin:6px 0 4px;background:#5a3220;color:#fff4e0;font-size:18px;padding:6px 16px;box-shadow:0 2px 0 #3b2418}   /* v0.4.1 : lisible sur le panneau crème */
  #soldeFin .gain{color:#ffd56b;text-shadow:0 1px 2px #000}
  .barreCarte{display:flex;gap:10px;align-items:center;margin:2px 0 4px}
  .btnAlt{border:none;border-radius:12px;padding:6px 12px;background:#7aa35a;color:#fff;font-weight:bold;font-family:inherit;cursor:pointer;font-size:14px}
  .teteEcran{display:flex;align-items:center;justify-content:space-between;gap:8px;width:min(94vw,440px);color:#fff4e0;font-size:22px;margin:16px 0 10px}
  .teteEcran .fermer{border:none;background:#c8834a;color:#fff;border-radius:10px;font-size:18px;padding:4px 10px;cursor:pointer}
  .titreSec{color:#f1d3a5;width:min(94vw,440px);margin:10px 0 6px;font-weight:bold}
  .grilleArticles{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(94vw,440px)}
  .article{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff4e0;border:3px solid #c8834a;border-radius:16px;padding:10px 6px;color:#5a3220;font-family:inherit;cursor:pointer}
  .article .ico{font-size:34px}.article small{opacity:.75}
  .article .prix{margin-top:4px;background:#e0703a;color:#fff;border-radius:10px;padding:3px 10px;font-weight:bold}
  .article.pack .prix{background:#9a8f86}
  #boutiqueMsg{color:#fff4e0;margin:12px;min-height:22px;font-weight:bold;text-align:center}
  #boutiqueMsg.pop{animation:pop .35s ease-out}
  #ecranBoutique,#ecranPreNiveau{z-index:13}
  #preObjectifs{background:#fff4e0;color:#5a3220;border-radius:14px;padding:10px 14px;font-size:18px;width:min(88vw,400px);text-align:center}
  #preBoosters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(94vw,440px)}
  .boost{position:relative;display:flex;flex-direction:column;align-items:center;background:#fff4e0;border:3px solid #c8834a;border-radius:16px;padding:8px 2px;color:#5a3220;font-family:inherit;cursor:pointer}
  .boost .ico{font-size:30px}.boost small{font-size:10px}
  .boost .nb{position:absolute;top:-8px;right:-6px;background:#5a3220;color:#fff;border-radius:10px;min-width:20px;font-size:12px;padding:1px 4px;border:2px solid #fff}
  .boost.on{border-color:#7aa35a;background:#dfe9d3;box-shadow:0 0 0 3px #ffd56b}
  .boost.vide{opacity:.55}.boost.vide .nb{background:#7aa35a}.boost.vide .nb:after{content:" +"}
  #preJouer{margin-top:16px;border:none;border-radius:16px;padding:14px 46px;font-size:22px;font-weight:bold;background:#e0703a;color:#fff;box-shadow:0 4px 0 #a64a20;font-family:inherit;cursor:pointer}
  .ligneBtns{display:flex;gap:10px;margin-top:12px}
  #renoSuivant .btnAlt{display:block;margin:8px auto 0}
  #version{position:fixed;right:6px;bottom:4px;font-size:11px;color:rgba(255,244,224,.55);pointer-events:none}
  /* Panneau debug */
  #debug{position:fixed;top:6px;right:6px;display:none;background:rgba(30,15,8,.92);color:#fff4e0;
    border:2px solid #c8834a;border-radius:12px;font-size:12px;width:178px;z-index:10}
  #debug.show{display:block}
  #debug .tete{padding:6px 8px;cursor:pointer;font-weight:bold;display:flex;justify-content:space-between}
  #debug .corps{padding:0 8px 8px}
  #debug.replie .corps{display:none}
  #debug button{margin:2px 0;width:49%;padding:5px 2px;font-size:11px;border:none;border-radius:6px;background:#e0703a;color:#fff;cursor:pointer}
  #debug button.on{background:#7aa35a}
  #debug .stat{font-family:monospace;font-size:10px;margin:4px 0;white-space:pre-wrap;word-break:break-all}
  #debug .titre{margin-top:4px;opacity:.7}
  #btnLogFin{background:#8a5a3b !important;box-shadow:0 4px 0 #5a3220 !important;font-size:14px !important;padding:8px !important}
</style>
</head>
<body>
<canvas id="jeu"></canvas>
<div id="overlay"><div id="panel">
  <h1 id="titreFin"></h1><div class="solde" id="soldeFin"></div><div id="banqueFin" style="display:none"></div><p id="texteFin"></p>

<div id="ecranRenovation" class="ecran">

  <div id="renoScene"><div class="couche" id="renoAvant"></div><div class="couche" id="renoApres"></div><div id="renoOverlays"></div><div id="renoEclat">✨</div><div id="renoBarre"><div id="renoProgres"></div></div></div>

</div>
<div id="ecranNiveaux" class="ecran"><h1>👨‍🍳 Chef Match</h1><div class="barreCarte"><span class="solde"></span><button class="btnAlt" id="btnBoutique">🛒 Boutique</button></div><div class="sous">La Petite Marée – choisis un niveau</div><div id="grilleNiveaux"></div></div>

 <div class="corps">

<script>
"use strict";
/* =====================================================================
 * 1. CONFIGURATION & NIVEAU (données pures, futur fichier JSON)
 * ===================================================================== */
const VERSION = "v0.5.1";
/** v0.5 : options de jeu. glissementPlat : un plat s'échange comme une pièce avec une voisine si la pièce déplacée
 *  matche (le plat ne matche jamais) ; arrivé sur la dernière case jouable il est livré. false = plats immobiles. */
const CONFIG_JEU = { glissementPlat: true,
  livraisonAvantDerniere: false };   // v0.5 expérience N30 : un plat arrivé sur l'avant-dernière case jouable de sa colonne est livré (OFF)
const CONFIG = {
  types: ["🍕","🍔","🍣","🥐","🍩","🥗"], // index = type de pièce
  durees: { swap: 160, rebond: 130, pop: 180, chuteParCase: 70, spawn: 160 }, // ms
  seuilSwipe: 0.3,
  indiceCoupsMax: 3,        // indice seulement si coups restants <= 3
  delaiIndice: 15000,       // ms d'inactivité avant l'indice automatique (v0.2.6 : 15 s)          // fraction de case pour déclencher un swipe
  couleurs: { fond:"#3b2418", plateau:"#f3d9b1", case1:"#fbe8c8", case2:"#f1d3a5",
              hud:"#fff4e0", texte:"#5a3220", accent:"#e0703a", selection:"#ffb347" }
};

/* =====================================================================
 * FORMAT DE NIVEAUX v5 (rétrocompatible v4) – doc complète : /workspace/chefmatch/levels_format_v5.md
 *  Un niveau v4 (sans "blockers") se charge et se joue À L'IDENTIQUE (même tirage aléatoire).
 *  Ajouts v5, tous optionnels :
 *   "blockers": [ { "type": "nappe", "hp": 2, "cells": [[r,c],...] },      // liste de cases
 *                 { "type": "assiette", "hp": 2, "zone": [r0,c0,r1,c1] },  // rectangle inclus
 *                 { "type": "carton", "hp": 3, "r": 4, "c": 3 },           // une seule case
 *                 { "type": "plat", "cells": [[0,2]] } ]                   // plat à livrer
 *   Couches par case (cumulables) :
 *     sol    : nappe (1-2 PV) – sous la pièce ; perd 1 PV quand une pièce est effacée sur la case
 *     case   : assiette (1-2), carton (1-3), casserole (1, se propage) – occupe la case, pas de pièce ;
 *              perd 1 PV par match adjacent et par power-up qui la touche ; les pièces tombent « à travers »
 *     dessus : glace (1-2, sensible aux matchs adjacents), chaîne (1, seulement si la pièce est matchée
 *              ou touchée par un power-up) – la pièce dessous ne peut ni être échangée ni tomber
 *   Un même bloqueur ne perd qu'1 PV par résolution (un match + un power-up simultanés = 1 PV).
 *   "goals" v5 : { "type":"collect", "piece":"tomato", "count":12 }          (v4, inchangé)
 *                { "type":"blocker", "blocker":"nappe", "count":12 }        (compte les bloqueurs DÉTRUITS)
 *                { "type":"blocker", "blocker":"casserole" }                (sans count = « tous » : compteur
 *                                                                            dynamique = nombre restant sur le plateau)
 *                { "type":"deliver", "count":3 }                            (plats sortis par le bas ;
 *                                                                            sans count = nombre de plats posés)
 * ===================================================================== */

/* --- Niveau de démonstration debug (?niveau=demo) : un exemplaire de chaque bloqueur --- */
const NIVEAU_DEMO = {
  id: "demo", moves: 40, colors: ["tomato", "croissant", "macaron", "basil", "cheese"], targetWinRate: null,
  grid: ["........", "........", "........", "........", "........", "........", "........", "........"],
  blockers: [

    if (ici.case) err("PLAT_SUR_BLOQUEUR", [r, c], `posé sur une case occupée par un bloqueur (${ici.case}) : le moteur le supprime`);
    let dessous = 0, premier = null;
    for (let y = r + 1; y < L; y++) if (jouable(y, c)) { dessous++; if (premier === null) premier = y; }
    const rang = dessous + 1;
    if (rang <= 2) err("PLAT_TROP_BAS", [r, c], `démarre à la ${rang === 1 ? "1re" : "2e"} case jouable depuis le bas de la colonne ${c} (minimum : 3e) : aucun match vertical ne peut le faire descendre`);
    if (premier !== null && (couche[premier + "," + c] || {}).case === "assiette") err("PLAT_SUR_ASSIETTE", [r, c], `directement au-dessus d'une assiette (case [${premier},${c}])`);
    if (ici.dessus && !ici.case) avertissements.push({ code: "PLAT_SOUS_GLACE", plat: [r, c], message: `Niveau ${id}, plat [${r},${c}] : sur une case ${ici.dessus} (retiré par le moteur)` });
  }
  const stews = (N.blockers || []).filter(b => b.type === "stew_pot");
  for (const b of stews) {
    const cs = cellulesValidation(b);
    if (!b.color || !(N.colors || []).includes(b.color)) erreurs.push({ code: "STEW_COULEUR", plat: cs[0] || null, message: `Niveau ${id}, casserole [${cs[0]}] : couleur « ${b.color} » absente des couleurs du niveau` });
    for (const [r, c] of cs) if (!jouable(r, c)) erreurs.push({ code: "STEW_HORS_JEU", plat: [r, c], message: `Niveau ${id}, casserole [${r},${c}] : hors grille ou sur une case vide '#'` });
  }
  if (N.vapeur && !stews.length) avertissements.push({ code: "VAPEUR_SANS_STEW", plat: null, message: `Niveau ${id} : "vapeur": true sans casserole (sans effet)` });
  return { id, ok: erreurs.length === 0, erreurs, avertissements };
}
/*</validation>*/
const VALIDATION_NIVEAUX = NIVEAUX.map(validerNiveau);
/** Niveaux rejetés : marqués non jouables (N.invalide = erreurs), erreur claire en console + journal persistant. */
VALIDATION_NIVEAUX.forEach((v, i) => {
  if (v.ok) return;
  NIVEAUX[i].invalide = v.erreurs;
  if (typeof console !== "undefined") v.erreurs.forEach(e => console.error("[Niveaux] REJETÉ " + e.code + " – " + e.message));
});
function journaliserNiveauxInvalides() {
  const ko = VALIDATION_NIVEAUX.filter(v => !v.ok); if (!ko.length) return;
  Store.set("chefmatch.niveauxRejetes", { t: new Date().toISOString(), version: VERSION, niveaux: ko.map(v => ({ id: v.id, erreurs: v.erreurs.map(e => e.code + " " + JSON.stringify(e.plat)) })) });
}

const EcoLog = {

  /** v0.5.1 : dernier niveau gagné (persisté) — sert aux paiements de la banque. */
  dernierGagne() { const n = Store.get(this.CLE_GAGNE, null); return typeof n === "number" ? n : null; },

  niveauCourant() { if (this.niveau != null) return this.niveau; try { return Progres.lire().debloques || null; } catch (e) { return null; } },
  noter(evt, champs) { const e = { evt, ...champs, t: new Date().toISOString(), version: VERSION }; Store.set(this.CLE, [...this.tous(), e].slice(-this.MAX)); return e; },

const Economie = {
  CLE: "chefmatch.economie",
  lire() {

    return e && typeof e.or === "number" ? e : { or: CONFIG_ECONOMIE.orDepart, etoiles: 0, niveauxEtoiles: [], journal: [] };
  },
  ecrire(e) { e.journal = e.journal.slice(-CONFIG_ECONOMIE.journalMax); Store.set(this.CLE, e); return e; },

  ajouterOr(n, raison = "") { const e = this.lire(); e.or += n; this.journaliser(e, { type: "or", n, raison }); return this.ecrire(e).or; },

  depenserOr(n, raison = "", niveau = null) { const e = this.lire(); if (e.or < n) return false; e.or -= n; this.journaliser(e, { type: "or", n: -n, raison }); this.ecrire(e); EcoLog.goldSpent(n, raison, niveau); return true; },

  gagnerEtoilesNiveau(idNiveau) {

  recharger(m = Date.now()) {
    if (this.nombre(m) >= CONFIG_ECONOMIE.vies.max) return { ok: false, raison: "pleines" };
    if (!Economie.depenserOr(CONFIG_ECONOMIE.vies.rechargeOr, "recharge_vies")) return { ok: false, raison: "or" };
    Store.set(this.CLE, { n: CONFIG_ECONOMIE.vies.max, t: m }); return { ok: true };
  },
  reset() { Store.del(this.CLE); }
};

/** Progression : nombre de niveaux débloqués + meilleur résultat par niveau (id). */
const Progres = {
  lire() { const p = Store.get(CLES.progres, null); return p && p.debloques ? p : { debloques: 1, meilleurs: {} }; },
  estDebloque(index) { return index < this.debloquesEffectifs(); },
  /** Les niveaux rejetés par la validation ne bloquent pas la progression : on les saute. */
  debloquesEffectifs() { let d = this.lire().debloques; while (d < NIVEAUX.length && NIVEAUX[d - 1] && NIVEAUX[d - 1].invalide) d++; return d; },
  enregistrer(index, id, victoire, coupsRestants) {
    const p = this.lire(), m = p.meilleurs[id] || { essais: 0, victoires: 0, meilleursCoupsRestants: null };
    m.essais++;
    if (victoire) {
      m.victoires++;
      m.meilleursCoupsRestants = Math.max(m.meilleursCoupsRestants ?? -1, coupsRestants);
      p.debloques = Math.min(NIVEAUX.length, Math.max(p.debloques, index + 2));
    }
    p.meilleurs[id] = m; Store.set(CLES.progres, p); return p;
  },
  toutDebloquer() { const p = this.lire(); p.debloques = NIVEAUX.length; Store.set(CLES.progres, p); },
  reset() { Store.del(CLES.progres); Store.del(CLES.intro); }
};

/* =====================================================================
 * 2. BOARD – logique pure de la grille (aucun DOM, testable sous Node)
 *    Pièce = { id, type (0..5 ou -1 pour la bombe couleur), special }
 *    special : null | "ligneH" | "ligneV" | "bombe" | "couleur"
 * ===================================================================== */
let prochainId = 1;
function creerPiece(type, special = null) {
  return { id: prochainId++, type, special };
}
/** Plat à livrer : pièce non matchable, indestructible, qui tombe avec la gravité. */
function creerPlat() { return { id: prochainId++, type: TYPE_PLAT, special: null, plat: true }; }

class Board {
  /** masque : tableau de chaînes ('.' jouable, '#' vide) ou null = tout jouable */
  constructor(lignes, colonnes, nbTypes, rng = Math.random, masque = null, bloqueurs = null) {
    this.L = lignes; this.C = colonnes; this.nbTypes = nbTypes; this.rng = rng; this.masque = masque;
    this.initCouches(bloqueurs);
    this.grille = [];
    this.remplirSansMatch();
  }

  /* ---------- v0.3 : couches de bloqueurs ----------
   *  this.sol[r][c]    : { type:"nappe", hp } | null           (sous la pièce)
   *  this.bloc[r][c]   : { type, hp } | null                    (occupe la case : grille[r][c] reste null)
   *  this.dessus[r][c] : { type:"glace"|"chaine", hp } | null   (recouvre la pièce : elle est figée)
   *  Sans bloqueur, aucun appel au générateur aléatoire n'est ajouté (niveaux v4 identiques). */
  initCouches(liste) {
    const vide = () => Array.from({ length: this.L }, () => new Array(this.C).fill(null));
    this.sol = vide(); this.bloc = vide(); this.dessus = vide(); this.platsInit = [];
    this.aDesBloqueurs = false; this.casseroleTouchee = false;
    this.numCoup = 0; this.ragoutsAServir = []; this.vapeur = this.vapeur || false;
    for (const b of liste || []) for (const [r, c] of cellulesBloqueur(b)) {
      if (!this.jouable(r, c)) continue;
      if (b.type === "plat") { if (!this.bloc[r][c]) { this.platsInit.push({ r, c }); this.aDesBloqueurs = true; } continue; }
      const def = BLOQUEURS[b.type]; if (!def) continue;
      const hp = Math.max(1, Math.min(def.hpMax, b.hp || 1));
      if (def.couche === "sol") this.sol[r][c] = { type: b.type, hp };
      else if (def.couche === "case") { this.bloc[r][c] = b.type === "stew_pot"
          ? { type: b.type, hp: 1, couleur: Number.isInteger(b.couleur) && b.couleur >= 0 ? b.couleur : 0, jauge: 0, sansBulle: 0, glaces: 0, dernierMatch: -1, bulleCoup: -1 }
          : { type: b.type, hp }; this.dessus[r][c] = null; }
      else if (!this.bloc[r][c]) this.dessus[r][c] = { type: b.type, hp };
      this.aDesBloqueurs = true;
    }
    this.platsInit = this.platsInit.filter(({ r, c }) => !this.bloc[r][c] && !this.dessus[r][c]);
  }
  /** Case occupée par un bloqueur (aucune pièce possible). */
  occupee(r, c) { return !!(this.bloc[r] && this.bloc[r][c]); }
  /** Case figée : bloqueur occupant ou pièce recouverte (ne tombe pas, ne s'échange pas). */
  fixe(r, c) { return !!((this.bloc[r] && this.bloc[r][c]) || (this.dessus[r] && this.dessus[r][c])); }
  /** Power-up activable par double-tap (pas sous glace/chaîne). */
  peutActiver(r, c) { const p = this.get(r, c); return !!(p && p.special && !this.dessus[r][c]); }
  /** v0.4-dev : pose les boosters pré-niveau sur des pièces normales libres. Renvoie [{r,c,special}]. */
  poserBoosters(types) {
    const poses = [];
    for (const k of types) {
      const libres = this.cases().filter(({ r, c }) => { const p = this.grille[r][c]; return p && !p.special && !p.plat && !this.fixe(r, c); });
      if (!libres.length) break;
      const { r, c } = libres[Math.floor(this.rng() * libres.length)], p = this.grille[r][c];
      p.special = k === "ligneH" ? (this.rng() < .5 ? "ligneH" : "ligneV") : k;
      if (k === "couleur") p.type = -1;
      poses.push({ r, c, special: p.special });
    }
    return poses;
  }
  /** Nombre de bloqueurs d'un type encore présents (toutes couches). */
  compterBloqueurs(type) {
    let n = 0;
    for (let r = 0; r < this.L; r++) for (let c = 0; c < this.C; c++)
      for (const couche of [this.sol, this.bloc, this.dessus]) if (couche[r][c] && couche[r][c].type === type) n++;
    return n;
  }
  /** v0.5 : cases mobiles sous un plat (0 = dernière case, 1 = avant-dernière). */
  distancePlat(r, c) { let d = 0; for (let y = r + 1; y < this.L; y++) if (this.jouable(y, c) && !this.fixe(y, c)) d++; return d; }
  positionsPlats() { return this.cases().filter(({ r, c }) => this.grille[r] && this.grille[r][c] && this.grille[r][c].plat); }
  /**
   * Livraison : un plat arrivé sur la dernière case jouable ET mobile de sa colonne sort du plateau
   * (trous '#' ignorés, cases à bloqueur occupant ou pièce figée sous glace/chaîne traversées comme par la gravité).
   * Appelée après chaque chute : toute pièce détruite sous un plat (match horizontal, vertical, L/T, power-up) le fait descendre.
   * NB géométrie : à 1 ou 2 cases du bas, aucun match vertical ne tient sous le plat (il faut 3 cases) ;
   * seuls un match horizontal/L/T plus bas, un power-up ou l'échange du plat avec la pièce du dessous le font descendre.
   */
  collecterPlats() {
    if (!this.platsInit.length) return [];
    const sortis = [];
    for (let c = 0; c < this.C; c++) {
      let bas = -1; for (let r = this.L - 1; r >= 0; r--) if (this.jouable(r, c) && !this.fixe(r, c)) { bas = r; break; }
      const p = bas >= 0 ? this.grille[bas][c] : null;
      if (p && p.plat) { sortis.push({ r: bas, c, piece: p }); this.grille[bas][c] = null; }
      else if (bas >= 0 && CONFIG_JEU.livraisonAvantDerniere) {   // variante : avant-dernière case jouable (mobile) de la colonne
        let av = -1; for (let r = bas - 1; r >= 0; r--) if (this.jouable(r, c) && !this.fixe(r, c)) { av = r; break; }
        const q = av >= 0 ? this.grille[av][c] : null; if (q && q.plat) { sortis.push({ r: av, c, piece: q }); this.grille[av][c] = null; }
      }
    }
    return sortis;
  }
  /**
   * Casseroles : si aucune casserole n'a été touchée pendant le coup, l'une d'elles « déborde »
   * sur une pièce normale voisine (qui devient une casserole). Renvoie {r,c,piece} ou null.
   */
  propagerCasseroles() {
    if (!this.aDesBloqueurs) return null;
    const touchee = this.casseroleTouchee; this.casseroleTouchee = false;
    if (touchee) return null;
    const cand = [], vu = new Set();
    for (let r = 0; r < this.L; r++) for (let c = 0; c < this.C; c++) {
      if (!this.bloc[r][c] || this.bloc[r][c].type !== "casserole") continue;
      for (const [dr, dc] of DIRS4) {
        const y = r + dr, x = c + dc, p = this.get(y, x);
        if (p && !p.special && !p.plat && !this.fixe(y, x) && !vu.has(y * this.C + x)) { vu.add(y * this.C + x); cand.push({ r: y, c: x }); }
      }
    }
    if (!cand.length) return null;
    const cible = cand[Math.floor(this.rng() * cand.length)], piece = this.grille[cible.r][cible.c];
    this.grille[cible.r][cible.c] = null; this.bloc[cible.r][cible.c] = { type: "casserole", hp: 1 };
    return { ...cible, piece };
  }
  /** Le motif (cases) touche-t-il un bloqueur d'objectif (dessous, dessus, voisin sensible) ou fait-il descendre un plat ? */
  toucheBloqueurs(cases, types) {
    if (!types.length || !this.aDesBloqueurs) return false;
    for (const { r, c } of cases) {
      if (this.sol[r][c] && types.includes(this.sol[r][c].type)) return true;
      if (this.dessus[r][c] && types.includes(this.dessus[r][c].type)) return true;
      for (const [dr, dc] of DIRS4) {
        const y = r + dr, x = c + dc; if (!this.dansGrille(y, x)) continue;
        const b = this.bloc[y][x] || this.dessus[y][x];
        if (b && BLOQUEURS[b.type].adjacent && types.includes(b.type)) return true;
      }
      if (types.includes("plat")) for (let y = 0; y < r; y++) { const p = this.grille[y][c]; if (p && p.plat) return true; }
    }
    return false;
  }
  dansGrille(r, c) { return r >= 0 && r < this.L && c >= 0 && c < this.C; }
  jouable(r, c) { return this.dansGrille(r, c) && (!this.masque || (this.masque[r] || "")[c] !== "#"); }
  get(r, c) { return this.jouable(r, c) ? this.grille[r][c] : null; }
  /** Liste des cases jouables */
  cases() { const l = []; for (let r = 0; r < this.L; r++) for (let c = 0; c < this.C; c++) if (this.jouable(r, c)) l.push({ r, c }); return l; }
  /** Grille pleine (toutes les cases jouables occupées) */
  estPleine() { return this.cases().every(({ r, c }) => this.occupee(r, c) || this.grille[r][c]); }
  typeAleatoire() { return Math.floor(this.rng() * this.nbTypes); }

  /** Remplit la grille sans aucun match initial et avec au moins un coup possible. */
  remplirSansMatch(fixes = null) {
    const t_ = (p, t) => p && p.type === t;
    // Plats à livrer : conservés à leur place actuelle (ou position initiale au premier remplissage)
    const plats = new Set((this.grille.length && this.aDesBloqueurs ? this.positionsPlats() : this.platsInit).map(x => x.r * this.C + x.c));
    let garde = 0;
    do {
      this.grille = [];
      for (let r = 0; r < this.L; r++) {
        this.grille.push([]);
        for (let c = 0; c < this.C; c++) {
          if (!this.jouable(r, c) || this.occupee(r, c)) { this.grille[r].push(null); continue; }
          if (plats.has(r * this.C + c)) { this.grille[r].push(creerPlat()); continue; }
          const fixe = fixes && fixes.get(r * this.C + c);
          if (fixe) { this.grille[r].push(creerPiece(fixe.type, fixe.special || null)); continue; }
          let t, essais = 0;
          do { t = this.typeAleatoire(); essais++; } while (essais < 50 && (
            (c >= 2 && t_(this.grille[r][c-1], t) && t_(this.grille[r][c-2], t)) ||
            (r >= 2 && t_(this.grille[r-1][c], t) && t_(this.grille[r-2][c], t)) ||
            (r >= 1 && c >= 1 && t_(this.grille[r-1][c], t) && t_(this.grille[r][c-1], t) && t_(this.grille[r-1][c-1], t))));
          this.grille[r].push(creerPiece(t));
        }
      }
    } while (fixes ? false : (this.trouverMatches().length > 0 || !this.aUnCoupPossible()) && ++garde < 500);
  }

  /**
   * Prépare une grille de tutoriel : motif imposé + coup évident.
   * Réessaie jusqu'à ce qu'il n'y ait aucun match initial et que le coup
   * produise bien le special attendu. Renvoie le coup {a,b} ou null.
   */
  preparerTuto(tuto) {
    const fixes = new Map(), k = (r, c) => r * this.C + c;
    (tuto.cellules || []).forEach(([r, c]) => fixes.set(k(r, c), { type: 0 }));
    (tuto.specials || []).forEach(([r, c, sp], i) => fixes.set(k(r, c), { type: i + 1, special: sp }));
    const a = { r: tuto.coup[0][0], c: tuto.coup[0][1] }, b = { r: tuto.coup[1][0], c: tuto.coup[1][1] };
    for (let essai = 0; essai < 300; essai++) {
      this.remplirSansMatch(fixes);
      if (this.trouverMatches().length) continue;
      if (tuto.specials) return { a, b };
      if (this.get(b.r, b.c) && this.get(b.r, b.c).type === 0) continue;
      this.echanger(a, b);
      const g = this.trouverMatches();
      this.echanger(a, b);
      if (g.length === 1 && this.specialPourGroupe(g[0]) === tuto.attendu) return { a, b };
    }
    this.remplirSansMatch(); return null;
  }

  echanger(a, b) {
    const t = this.grille[a.r][a.c];
    this.grille[a.r][a.c] = this.grille[b.r][b.c];
    this.grille[b.r][b.c] = t;
  }

  /** Deux pièces de même type « matchable » ? (la bombe couleur ne matche pas) */
  memeType(p, q) { return p && q && p.type >= 0 && p.type === q.type; }

  /**
   * Détection des motifs selon les règles MatchDesign, par priorité :
   *   1. 5 en ligne         -> Étoile (couleur)
   *   2. L / T (3H x 3V)    -> Poêle (bombe 3x3)
   *   3. 4 en ligne         -> Couteau (ligneH / ligneV selon le sens)
   *   4. carré 2x2          -> Cloche
   *   5. 3 en ligne         -> simple
   * Chaque pièce n'appartient qu'à UN motif (les cases déjà prises sont exclues).
   * Retour : [{ cases:[{r,c}], special, centre? }]
   */
  trouverMatches() {
    const segs = [];
    for (let r = 0; r < this.L; r++) {             // segments horizontaux >= 3
      let c = 0;
      while (c < this.C) {
        let f = c + 1;
        while (f < this.C && this.memeType(this.grille[r][c], this.grille[r][f])) f++;
        if (f - c >= 3) segs.push({ dir: "H", cases: Array.from({length:f-c}, (_, i) => ({ r, c: c+i })) });
        c = f;
      }
    }
    for (let c = 0; c < this.C; c++) {             // segments verticaux >= 3
      let r = 0;
      while (r < this.L) {
        let f = r + 1;
        while (f < this.L && this.memeType(this.grille[r][c], this.grille[f][c])) f++;
        if (f - r >= 3) segs.push({ dir: "V", cases: Array.from({length:f-r}, (_, i) => ({ r: r+i, c })) });
        r = f;
      }
    }
    const carres = [];                              // carrés 2x2
    for (let r = 0; r < this.L - 1; r++) for (let c = 0; c < this.C - 1; c++) {
      const p = this.grille[r][c];
      if (this.memeType(p, this.grille[r][c+1]) && this.memeType(p, this.grille[r+1][c]) && this.memeType(p, this.grille[r+1][c+1]))
        carres.push([{ r, c }, { r, c: c+1 }, { r: r+1, c }, { r: r+1, c: c+1 }]);
    }
    const K = x => x.r * this.C + x.c, pris = new Set(), motifs = [];
    const libre = cs => cs.every(x => !pris.has(K(x)));
    const prendre = (cases, special, extra = {}) => { cases.forEach(x => pris.add(K(x))); motifs.push({ cases, special, ...extra }); };
    // 1. Étoile
    segs.filter(s => s.cases.length >= 5).forEach(s => { if (libre(s.cases)) prendre(s.cases, "couleur", { dir: s.dir }); });
    // 2. Poêle (L/T) : un segment H et un segment V qui se croisent
    const H = segs.filter(s => s.dir === "H"), V = segs.filter(s => s.dir === "V");
    H.forEach(h => V.forEach(v => {
      const inter = h.cases.find(a => v.cases.some(b => a.r === b.r && a.c === b.c));
      if (inter && libre(h.cases) && libre(v.cases))
        prendre([...h.cases, ...v.cases.filter(b => !(b.r === inter.r && b.c === inter.c))], "bombe", { centre: inter });
    }));
    // 3. Couteau
    segs.filter(s => s.cases.length === 4).forEach(s => { if (libre(s.cases)) prendre(s.cases, s.dir === "H" ? "ligneH" : "ligneV", { dir: s.dir }); });
    // 4. Cloche
    carres.forEach(q => { if (libre(q)) prendre(q, "cloche"); });
    // 5. 3 en ligne (et restes de segments partiellement utilisés)
    segs.forEach(s => { const reste = s.cases.filter(x => !pris.has(K(x))); if (reste.length) prendre(reste, null); });
    return motifs;
  }

  /** Power-up produit par un motif (null = match simple) */
  specialPourGroupe(g) { return g.special; }

  /** Cases affectées par le déclenchement d'un special situé en (r,c). */
  zoneSpecial(piece, r, c, typeCible = null) {
    const z = [];
    if (piece.special === "ligneH") for (let x = 0; x < this.C; x++) z.push({ r, c: x });
    else if (piece.special === "ligneV") for (let y = 0; y < this.L; y++) z.push({ r: y, c });
    else if (piece.special === "bombe") {
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++)
        if (this.dansGrille(r+dr, c+dc)) z.push({ r: r+dr, c: c+dc });
    } else if (piece.special === "cloche") {
      // Cloche : sa case + 4 voisins orthogonaux (le vol vers une cible est géré à part)
      [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr, dc]) => { if (this.jouable(r+dr, c+dc)) z.push({ r: r+dr, c: c+dc }); });
    } else if (piece.special === "couleur") {
      // Sans cible explicite (réaction en chaîne) : le type le plus présent
      if (typeCible === null || typeCible < 0) typeCible = this.typeMajoritaire();
      z.push({ r, c });
      for (let y = 0; y < this.L; y++) for (let x = 0; x < this.C; x++)
        if (this.grille[y][x] && this.grille[y][x].type === typeCible) z.push({ r: y, c: x });
    }
    return z;
  }

  /**
   * Cible d'une cloche : au hasard parmi les pièces les plus proches dont le
   * type est un objectif incomplet ; sinon une case quelconque au hasard.
   */
  choisirCible(origine, typesObjectifs = [], exclus = new Set(), bloqueursObjectifs = []) {
    const toutes = this.cases().filter(x => (this.grille[x.r][x.c] || this.occupee(x.r, x.c)) && !exclus.has(x.r * this.C + x.c));
    if (!toutes.length) return null;
    const estObj = ({ r, c }) => {
      const p = this.grille[r][c]; if (p && typesObjectifs.includes(p.type)) return true;
      return bloqueursObjectifs.some(t => [this.sol, this.bloc, this.dessus].some(k => k[r][c] && k[r][c].type === t));
    };
    const obj = toutes.filter(estObj);
    if (obj.length) {
      const d = x => Math.abs(x.r - origine.r) + Math.abs(x.c - origine.c);
      const dmin = Math.min(...obj.map(d)), proches = obj.filter(x => d(x) === dmin);
      return proches[Math.floor(this.rng() * proches.length)];
    }
    return toutes[Math.floor(this.rng() * toutes.length)];
  }

  typeMajoritaire() {
    const n = new Array(this.nbTypes).fill(0);
    this.grille.flat().forEach(p => { if (p && p.type >= 0) n[p.type]++; });
    return n.indexOf(Math.max(...n));
  }

  /**
   * Calcule un « coup de résolution » complet :
   *  - cases initiales à effacer (matches et/ou zone d'activation)
   *  - propagation en chaîne des specials touchés
   *  - création des nouveaux specials (non effacés)
   * Modifie la grille (cases effacées = null) et renvoie
   * { effacees:[{r,c,piece}], crees:[{r,c,piece}] }.
   * @param initiales  cases à effacer
   * @param creations  [{r,c,special,type}] power-ups à poser
   * @param ciblesCouleur Map clé->type pour les bombes couleur échangées
   */
  effacer(initiales, creations = [], ciblesCouleur = new Map(), opts = {}) {
    const aEffacer = new Map();          // clé -> {r,c}
    const touches = new Map(), vus = new Set();   // v0.3 : bloqueurs (case/dessus) touchés, 1 PV max par résolution
    const pile = [...initiales];
    const protegees = new Set(creations.map(k => k.r * this.C + k.c));
    const vols = [];                     // envols de cloches à animer ensuite
    const chaine = [];                   // ordre de déclenchement (debug/tests)
    while (pile.length) {
      const { r, c } = pile.pop();
      const k = r * this.C + c;
      if (this.aDesBloqueurs && this.dansGrille(r, c) && (this.bloc[r][c] || this.dessus[r][c])) {
        // Bloqueur occupant / pièce recouverte : on abîme le bloqueur, la pièce dessous reste (et son special ne part pas)
        if (!vus.has(k)) { vus.add(k); touches.set(k, { r, c }); }
        continue;
      }
      if (aEffacer.has(k) || !this.grille[r][c]) continue;
      const p = this.grille[r][c];
      if (p.plat) continue;                // les plats sont indestructibles
      aEffacer.set(k, { r, c, piece: p });
      if (p.special === "cloche")
        for (let n = 0; n < (p.nbVols || 1); n++) vols.push({ r, c, porte: p.porte || null });
      if (p.special) {                    // réaction en chaîne
        chaine.push(p.special);
        this.zoneSpecial(p, r, c, ciblesCouleur.has(k) ? ciblesCouleur.get(k) : null)
          .forEach(z => pile.push(z));
      }
    }
    const effacees = [...aEffacer.values()];
    effacees.forEach(({ r, c }) => { this.grille[r][c] = null; });
    const crees = [];
    creations.forEach(cr => {
      // La pièce normale remplacée par le power-up compte aussi comme effacée (objectifs)
      const ancienne = this.grille[cr.r][cr.c];
      if (ancienne) effacees.push({ r: cr.r, c: cr.c, piece: ancienne, remplacee: true });
      const piece = creerPiece(cr.special === "couleur" ? -1 : cr.type, cr.special);
      this.grille[cr.r][cr.c] = piece;
      crees.push({ r: cr.r, c: cr.c, piece });
    });
    const bloqueurs = this.aDesBloqueurs ? this.degatsBloqueurs(initiales, creations, effacees, touches, vus, opts) : [];
    return { effacees, crees, protegees, vols, chaine, bloqueurs };
  }

  /**
   * v0.3 – Applique les dégâts aux bloqueurs après une résolution :
   *  - cases/dessus touchés directement (match sur pièce recouverte, zone de power-up, cible de cloche)
   *  - voisins sensibles (adjacent:true) des cases d'un MATCH (opts.match), y compris la case du power-up créé
   *  - nappes sous chaque pièce effacée
   * Renvoie [{ r, c, type, couche, hp, detruit }].
   */
  degatsBloqueurs(initiales, creations, effacees, touches, vus, opts) {
    const evts = [], directs = new Set(touches.keys());   // v0.5 : touchés directement (zone de power-up, cloche)
    const actives = effacees.filter(e => e.piece && e.piece.special && !e.remplacee);   // power-ups déclenchés
    for (const a of actives) for (const [dr, dc] of DIRS4) {   // casserole voisine d'un power-up déclenché
      const r = a.r + dr, c = a.c + dc; if (!this.dansGrille(r, c)) continue;
      const k = r * this.C + c, b = this.bloc[r][c]; if (b && b.type === "stew_pot" && !touches.has(k)) { vus.add(k); touches.set(k, { r, c }); }
    }
    if (opts.match) for (const s of [...initiales, ...creations]) for (const [dr, dc] of DIRS4) {
      const r = s.r + dr, c = s.c + dc; if (!this.dansGrille(r, c)) continue;
      const k = r * this.C + c, b = this.bloc[r][c] || this.dessus[r][c];
      if (b && BLOQUEURS[b.type].adjacent && !vus.has(k)) { vus.add(k); touches.set(k, { r, c }); }
    }
    touches.forEach(({ r, c }, k) => {
      const couche = this.bloc[r][c] ? this.bloc : this.dessus, b = couche[r][c];
      if (b.type === "stew_pot") { const e = this.bullesRagout(r, c, b, directs.has(k) || actives.some(a => Math.abs(a.r - r) + Math.abs(a.c - c) === 1)); if (e) evts.push(e); return; }
      b.hp--; if (b.type === "casserole") this.casseroleTouchee = true;
      const detruit = b.hp <= 0; if (detruit) couche[r][c] = null;
      evts.push({ r, c, type: b.type, couche: couche === this.bloc ? "case" : "dessus", hp: Math.max(0, b.hp), detruit });
    });
    const nappes = new Set();
    effacees.forEach(({ r, c }) => {
      const k = r * this.C + c, n = this.sol[r][c]; if (!n || nappes.has(k)) return;
      nappes.add(k); n.hp--; const detruit = n.hp <= 0; if (detruit) this.sol[r][c] = null;
      evts.push({ r, c, type: n.type, couche: "sol", hp: Math.max(0, n.hp), detruit });
    });
    return evts;
  }

  /** v0.5 : début d'un coup joué (sert au « max 1 bulle par coup » et au compteur de vapeur). */
  debutCoup() { this.numCoup = (this.numCoup || 0) + 1; }
  /** v0.5 : bulles d'une casserole : +2 (power-up), sinon +1 par match adjacent (max 1 par coup). Servie à 3. */
  bullesRagout(r, c, b, parPowerUp) {
    const gain = parPowerUp ? 2 : b.dernierMatch === this.numCoup ? 0 : 1;
    if (!gain) return null;
    if (!parPowerUp) b.dernierMatch = this.numCoup;
    b.jauge = Math.min(BLOQUEURS.stew_pot.jauge, b.jauge + gain); b.bulleCoup = this.numCoup; b.sansBulle = 0;
    const detruit = b.jauge >= BLOQUEURS.stew_pot.jauge;
    if (detruit) { this.bloc[r][c] = null; (this.ragoutsAServir = this.ragoutsAServir || []).push({ r, c, couleur: b.couleur }); }
    return { r, c, type: "stew_pot", couche: "case", hp: detruit ? 0 : 1, jauge: b.jauge, gain, detruit, servi: detruit };
  }
  /** La case (r,c) prendrait-elle part à un match si sa pièce devenait du type t ? */
  formeMatchSi(r, c, t) {
    const ty = (y, x) => (y === r && x === c) ? t : (() => { const p = this.get(y, x); return p && !p.special && !p.plat ? p.type : -9; })();
    let h = 1; for (let x = c - 1; ty(r, x) === t; x--) h++; for (let x = c + 1; ty(r, x) === t; x++) h++;
    let v = 1; for (let y = r - 1; ty(y, c) === t; y--) v++; for (let y = r + 1; ty(y, c) === t; y++) v++;
    return h >= 3 || v >= 3;
  }
  /**
   * v0.5 : casseroles servies pendant le coup -> chacune projette 3 pièces de sa couleur.
   * Cibles : pièces normales (ni power-up, ni plat, ni glacées) d'une autre couleur, qui ne forment pas de match
   * immédiat ; priorité aux cases « à portée d'un match » (voisine d'une pièce de la couleur). Tirage avec le RNG du niveau.
   * Renvoie [{ depuis:{r,c}, couleur, cases:[{r,c}] }].
   */
  servirRagouts() {
    const liste = this.ragoutsAServir || []; this.ragoutsAServir = [];
    return liste.map(s => {
      const cases = [];
      for (let n = 0; n < 3; n++) {
        const cands = [], portee = [];
        for (let r = 0; r < this.L; r++) for (let c = 0; c < this.C; c++) {
          const p = this.get(r, c);
          if (!p || p.special || p.plat || p.type < 0 || p.type === s.couleur || this.fixe(r, c) || this.formeMatchSi(r, c, s.couleur)) continue;
          cands.push({ r, c });
          if (DIRS4.some(([dr, dc]) => { const q = this.get(r + dr, c + dc); return q && !q.special && q.type === s.couleur; })) portee.push({ r, c });
        }
        const pool = portee.length ? portee : cands; if (!pool.length) break;
        const x = pool[Math.floor(this.rng() * pool.length)];
        this.grille[x.r][x.c].type = s.couleur; cases.push(x);
      }
      return { depuis: { r: s.r, c: s.c }, couleur: s.couleur, cases };
    });
  }
  /** v0.5 : vapeur (si this.vapeur) — fin de coup : une casserole sans bulle depuis 4 coups pose 1 glace (1 PV) sur une voisine libre, max 2. */
  vapeurFinCoup() {
    const res = []; if (!this.vapeur) return res;
    for (let r = 0; r < this.L; r++) for (let c = 0; c < this.C; c++) {
      const b = this.bloc[r][c]; if (!b || b.type !== "stew_pot") continue;
      if (b.bulleCoup === this.numCoup) { b.sansBulle = 0; continue; }
      b.sansBulle++;
      if (b.sansBulle < CONFIG_STEW.vapeurCoups || b.glaces >= CONFIG_STEW.vapeurMax) continue;
      const cands = DIRS4.map(([dr, dc]) => ({ r: r + dr, c: c + dc })).filter(({ r: y, c: x }) => {
        const p = this.get(y, x); return p && !p.plat && !this.bloc[y][x] && !this.dessus[y][x]; });
      if (!cands.length) continue;
      const x = cands[Math.floor(this.rng() * cands.length)];
      this.dessus[x.r][x.c] = { type: "glace", hp: 1 }; b.glaces++; b.sansBulle = 0;
      res.push({ depuis: { r, c }, r: x.r, c: x.c });
    }
    return res;
  }
  /** Transforme les groupes de matches en cases + créations de power-ups. */
  analyserMatches(groupes, casesEchangees = []) {
    const cases = [], creations = [];
    groupes.forEach(g => {
      g.cases.forEach(cs => cases.push(cs));
      const sp = this.specialPourGroupe(g);
      if (!sp) return;
      // Position : la case échangée si elle fait partie du groupe, sinon croisement / milieu
      let pos = casesEchangees.find(e => g.cases.some(cs => cs.r === e.r && cs.c === e.c));
      if (!pos && sp === "bombe") pos = g.centre;
      if (!pos) pos = g.cases[Math.floor(g.cases.length / 2)];
      if (this.fixe(pos.r, pos.c)) pos = g.cases.find(x => !this.fixe(x.r, x.c));   // jamais de power-up sous la glace
      if (!pos) return;
      const type = this.grille[pos.r][pos.c].type;
      creations.push({ r: pos.r, c: pos.c, special: sp, type });
    });
    // La case du power-up n'est pas effacée... sauf si elle contenait déjà un special (il se déclenche)
    const cleCrea = new Set(creations.map(k => k.r * this.C + k.c));
    const filtrees = cases.filter(cs => !cleCrea.has(cs.r * this.C + cs.c) || this.grille[cs.r][cs.c].special);
    // Si un special occupe la case de création, il se déclenche d'abord puis le nouveau est posé
    return { cases: filtrees, creations };
  }

  /** Gravité : fait tomber les pièces. Renvoie [{piece, deR, versR, c}] */
  appliquerGravite() {
    const mouvements = [];
    for (let c = 0; c < this.C; c++) {
      // Les pièces tombent à travers les cases vides '#' jusqu'à la case jouable libre la plus basse
      // v0.3 : elles traversent aussi les bloqueurs occupants et les pièces figées (glace/chaîne)
      const rangs = []; for (let r = this.L - 1; r >= 0; r--) if (this.jouable(r, c) && !this.fixe(r, c)) rangs.push(r);
      let i = 0;
      for (const r of rangs) {
        const p = this.grille[r][c];
        if (p) {
          const dest = rangs[i++];
          if (dest !== r) {
            this.grille[dest][c] = p; this.grille[r][c] = null;
            mouvements.push({ piece: p, deR: r, versR: dest, c });
          }
        }
      }
    }
    return mouvements;
  }

  /** Remplit les cases vides par le haut. Renvoie [{piece, deR (négatif), versR, c}] */
  remplir() {
    const nouvelles = [];
    for (let c = 0; c < this.C; c++) {
      let vides = 0;
      for (let r = 0; r < this.L; r++) if (this.jouable(r, c) && !this.fixe(r, c) && !this.grille[r][c]) vides++;
      let n = 0;
      for (let r = 0; r < this.L; r++) {
        if (this.jouable(r, c) && !this.fixe(r, c) && !this.grille[r][c]) {
          const p = creerPiece(this.typeAleatoire());
          this.grille[r][c] = p;
          nouvelles.push({ piece: p, deR: (n++) - vides, versR: r, c });
        }
      }
    }
    return nouvelles;
  }

  /** Un échange (a,b) est-il valide ? (match créé ou special impliqué) */
  echangeValide(a, b) {
    const pa = this.get(a.r, a.c), pb = this.get(b.r, b.c);
    if (!pa || !pb) return false;
    if (this.fixe(a.r, a.c) || this.fixe(b.r, b.c)) return false;   // pièce sous glace/chaîne : immobile
    if ((pa.plat || pb.plat) && !CONFIG_JEU.glissementPlat) return false;   // v0.5 : switch glissement off = plat immobile
    if (pa.special || pb.special) return true;
    this.echanger(a, b);
    const ok = this.trouverMatches().length > 0;
    this.echanger(a, b);
    return ok;
  }

  /** Renvoie un coup possible {a,b} ou null. */
  trouverCoupPossible() {
    for (let r = 0; r < this.L; r++) for (let c = 0; c < this.C; c++) {
      if (c + 1 < this.C && this.echangeValide({r, c}, {r, c: c+1})) return { a: {r, c}, b: {r, c: c+1} };
      if (r + 1 < this.L && this.echangeValide({r, c}, {r: r+1, c})) return { a: {r, c}, b: {r: r+1, c} };
    }
    return null;
  }
  /** Coup possible : un échange valide, ou à défaut un power-up activable par double-tap. */
  aUnCoupPossible() {
    if (this.trouverCoupPossible() !== null) return true;
    return this.cases().some(({ r, c }) => this.peutActiver(r, c));
  }

  /**
   * Nombre de coups distincts (échanges valides + activations de power-up par double-tap).
   * @param max arrêt anticipé dès que max est atteint
   */
  compterCoups(max = Infinity) {
    let n = 0;
    for (const { r, c } of this.cases()) {
      if (this.peutActiver(r, c) && ++n >= max) return n;   // activation
      for (const [dr, dc] of [[0, 1], [1, 0]])
        if (this.jouable(r + dr, c + dc) && this.echangeValide({ r, c }, { r: r + dr, c: c + dc }) && ++n >= max) return n;
    }
    return n;
  }

  /**
   * Meilleur coup pour l'indice (règles MatchDesign) :
   *   1) activer un power-up (double-tap)   2) créer un power-up (étoile > poêle > couteau > cloche)
   *   3) matcher une pièce d'objectif      4) n'importe quel coup
   * Retour : { type, cellules:[{r,c}], a, b, special? } ou null
   */
  meilleurCoup(typesObjectifs = [], bloqueursObjectifs = []) {
    const pu = this.cases().find(({ r, c }) => this.peutActiver(r, c));
    if (pu) return { type: "activation", cellules: [pu], a: pu, b: pu, special: this.grille[pu.r][pu.c].special };
    const rang = { couleur: 4, bombe: 3, ligneH: 2, ligneV: 2, cloche: 1 };
    let meilleur = null, score = -1;
    for (const { r, c } of this.cases()) for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const a = { r, c }, b = { r: r + dr, c: c + dc };
      if (!this.jouable(b.r, b.c) || !this.echangeValide(a, b)) continue;
      this.echanger(a, b);
      const motifs = this.trouverMatches();
      const touchObjectif = motifs.some(m => m.cases.some(x => typesObjectifs.includes(this.grille[x.r][x.c].type)) ||
        this.toucheBloqueurs(m.cases, bloqueursObjectifs));
      this.echanger(a, b);
      let sc = 1, type = "simple", sp = null;
      const best = Math.max(0, ...motifs.map(m => rang[m.special] || 0));
      if (best) { sc = 100 + best * 10; sp = motifs.map(m => m.special).find(x => rang[x] === best); type = "creation_" + sp; }
      else if (touchObjectif) { sc = 50; type = "objectif"; }
      if (sc > score) { score = sc; meilleur = { type, cellules: [a, b], a, b, special: sp }; }
    }
    return meilleur;
  }

  /** Mélange en conservant les pièces (specials compris), sans match et avec un coup possible. */
  melanger() {
    const cases = this.cases().filter(({ r, c }) => !this.fixe(r, c)), pieces = cases.map(({ r, c }) => this.grille[r][c]);
    for (let essai = 0; essai < 200; essai++) {
      for (let i = pieces.length - 1; i > 0; i--) {
        const j = Math.floor(this.rng() * (i + 1)); [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
      }
      cases.forEach(({ r, c }, i) => { this.grille[r][c] = pieces[i]; });
      if (this.trouverMatches().length === 0 && this.aUnCoupPossible()) return true;
    }
    this.remplirSansMatch();   // repli : nouvelle grille
    return false;
  }
}

/* =====================================================================
 * 3. ANIMATOR – tweens avec easing, renvoie des Promises
 * ===================================================================== */
const Easing = {
  lineaire: t => t,
  sortieQuad: t => 1 - (1 - t) * (1 - t),
  entreeQuad: t => t * t,
  sortieRebond: t => { // petit rebond à l'atterrissage
    const n = 7.5625, d = 2.75;
    if (t < 1/d) return n*t*t; if (t < 2/d) return n*(t-=1.5/d)*t+.75;
    if (t < 2.5/d) return n*(t-=2.25/d)*t+.9375; return n*(t-=2.625/d)*t+.984375;
  },
  sortieBack: t => { const s = 1.70158; return 1 + (s+1)*Math.pow(t-1,3) + s*Math.pow(t-1,2); }
};

class Animator {
  constructor() { this.tweens = []; }
  /** Anime les propriétés numériques de obj vers cibles. */
  tween(obj, cibles, duree, easing = Easing.sortieQuad, delai = 0) {
    return new Promise(resolve => {
      const depart = {};
      for (const k in cibles) depart[k] = obj[k];
      this.tweens.push({ obj, depart, cibles, duree: Math.max(1, duree), t: -delai, easing, resolve });
    });
  }
  get actif() { return this.tweens.length > 0; }
  update(dt) {
    this.tweens = this.tweens.filter(tw => {
      tw.t += dt;
      if (tw.t < 0) return true;
      const p = Math.min(1, tw.t / tw.duree), e = tw.easing(p);
      for (const k in tw.cibles) tw.obj[k] = tw.depart[k] + (tw.cibles[k] - tw.depart[k]) * e;
      if (p >= 1) { tw.resolve(); return false; }
      return true;
    });
  }
}
const attendre = ms => new Promise(r => setTimeout(r, ms));

/* =====================================================================
 * 4. RENDERER – dessin Canvas (DPR, responsive portrait)
 *    Chaque pièce a un état visuel : vue = {x, y (en cases), echelle, alpha}
 * ===================================================================== */
class Renderer {
  constructor(canvas, jeu) {
    this.canvas = canvas; this.ctx = canvas.getContext("2d"); this.jeu = jeu;
    this.redimensionner();
    window.addEventListener("resize", () => this.redimensionner());
  }
  redimensionner() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.min(window.innerWidth, window.innerHeight * 0.62, 520), h = window.innerHeight;
    this.w = w; this.h = h;
    this.canvas.style.width = w + "px"; this.canvas.style.height = h + "px";
    this.canvas.width = Math.round(w * dpr); this.canvas.height = Math.round(h * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const { L, C } = this.jeu.board;
    this.taille = Math.floor(Math.min((w - 20) / C, (h - 190) / L));   // taille d'une case
    this.ox = (w - this.taille * C) / 2;
    this.oy = 146; // plateau aligné en haut, juste sous le HUD
  }
  /** Coordonnées écran -> case */
  caseDepuisPoint(px, py) {
    const c = Math.floor((px - this.ox) / this.taille), r = Math.floor((py - this.oy) / this.taille);
    return this.jeu.board.jouable(r, c) ? { r, c } : null;
  }
  rectArrondi(x, y, w, h, rad) {
    const g = this.ctx; g.beginPath(); g.moveTo(x+rad, y);
    g.arcTo(x+w, y, x+w, y+h, rad); g.arcTo(x+w, y+h, x, y+h, rad);
    g.arcTo(x, y+h, x, y, rad); g.arcTo(x, y, x+w, y, rad); g.closePath();
  }
  dessiner(temps) {
    const g = this.ctx, K = CONFIG.couleurs, j = this.jeu, b = j.board, T = this.taille;
    g.fillStyle = K.fond; g.fillRect(0, 0, this.w, this.h);
    const bg = Visuels.imageFond();
    if (bg) {   // fond terrasse en « cover » : rempli sans déformation, centré
      const e = Math.max(this.w / bg.naturalWidth, this.h / bg.naturalHeight), bw = bg.naturalWidth * e, bh = bg.naturalHeight * e;
      g.drawImage(bg, (this.w - bw) / 2, (this.h - bh) / 2, bw, bh);
    }
    this.dessinerHUD();
    // Plateau (damier crème)
    // Panneau crème semi-opaque sous la grille (validé ChefLead) : lisibilité sur le fond terrasse
    g.fillStyle = "rgba(255,244,224,.82)"; this.rectArrondi(this.ox-8, this.oy-8, T*b.C+16, T*b.L+16, 18); g.fill();
    g.strokeStyle = "rgba(200,131,74,.9)"; g.lineWidth = 3; g.stroke();
    const badgesNappe = [];
    for (let r = 0; r < b.L; r++) for (let c = 0; c < b.C; c++) {
      if (!b.jouable(r, c)) continue;   // case vide '#' : on voit le panneau
      g.fillStyle = (r + c) % 2 ? K.case2 : K.case1; g.globalAlpha = .75;
      g.fillRect(this.ox + c*T, this.oy + r*T, T, T); g.globalAlpha = 1;
      const n = b.sol[r][c];   // couche « sol » : nappe sale (rouge, plus foncée à 2 couches)
      const imN = n && Visuels.obstacle("nappe");
      if (imN) {   // nappe sous la pièce : ~60 % d'opacité, 2 couches = plus opaque + badge
        g.globalAlpha = n.hp > 1 ? .9 : .6; g.drawImage(imN, this.ox + c*T + 1, this.oy + r*T + 1, T - 2, T - 2); g.globalAlpha = 1;
        if (n.hp > 1) badgesNappe.push([this.ox + c*T, this.oy + r*T, n.hp]);
      } else if (n) {
        g.fillStyle = n.hp > 1 ? "rgba(178,34,52,.75)" : "rgba(226,86,86,.5)";
        this.rectArrondi(this.ox + c*T + 2, this.oy + r*T + 2, T - 4, T - 4, 6); g.fill();
        g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 1;
        for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(this.ox + c*T + i*T/4, this.oy + r*T + 3); g.lineTo(this.ox + c*T + i*T/4, this.oy + r*T + T - 3); g.stroke();
          g.beginPath(); g.moveTo(this.ox + c*T + 3, this.oy + r*T + i*T/4); g.lineTo(this.ox + c*T + T - 3, this.oy + r*T + i*T/4); g.stroke(); }
      }
    }
    if (b.platsInit.length) {   // flèches de livraison sous le plateau
      g.fillStyle = "#fff4e0"; g.font = "bold 12px Trebuchet MS"; g.textAlign = "center"; g.textBaseline = "middle";

      const vr = j.verrou, sec = vr && temps - vr.t < 450 && b.grille[vr.r] && b.grille[vr.r][vr.c] === p ? Math.sin((temps - vr.t) / 25) * T * .08 : 0;

      g.save(); g.globalAlpha = 1 - k * k; g.font = `${Math.floor(T * .5)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;

      const lignes = j.message.split("\n"), lw = Math.min(this.w - 20, Math.max(...lignes.map(l => g.measureText(l).width)) + 30);
      const hh = 24 * lignes.length + 18, y0 = this.oy + T*b.L/2 - hh/2;

  /** Petit badge chiffré des PV (affiché seulement si hp > 1). bas=true : coin bas-gauche (nappe). */

    g.fillStyle = bas ? "#b22234" : "#5a3220"; g.beginPath(); g.arc(cx, cy, T*.15, 0, Math.PI*2); g.fill();

    const badge = (x, y, hp) => { this.badgePV(x, y, hp); g.textAlign = "center"; g.textBaseline = "middle"; };

      const x = this.ox + c*T, y = this.oy + r*T, bl = b.bloc[r][c], de = b.dessus[r][c];
      const imB = bl && Visuels.obstacle(bl.type);

  /** v0.5 : marmites servies — frame courante de la spritesheet (repli emoji si l'image manque). */
  dessinerBursts() {

  /** v0.5 : casserole qui mijote — sprite, pastille de sa couleur, jauge de 3 bulles au-dessus. */
  dessinerRagout(x, y, bl, im, emo) {
    const g = this.ctx, T = this.taille, col = (PIECES_COULEURS[bl.couleur] || "#e8743b");

    else { g.fillStyle = "#9aa4ad"; this.rectArrondi(x + 3, y + 3, T - 6, T - 6, 9); g.fill(); g.font = `${Math.floor(T*.6)}px ${emo}`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("🍲", x + T/2, y + T*.56); }
    g.fillStyle = col; g.strokeStyle = "#fff"; g.lineWidth = 2; g.beginPath(); g.arc(x + T*.82, y + T*.8, T*.11, 0, Math.PI*2); g.fill(); g.stroke();

      g.beginPath(); g.arc(cx, cy, T*.075, 0, Math.PI*2); g.fillStyle = i < bl.jauge ? "#ffb347" : "rgba(255,255,255,.85)"; g.fill();
      g.strokeStyle = "#7a4a2a"; g.lineWidth = 1.5; g.stroke(); }
  }
  dessinerPiece(p, cx, cy, echelle, alpha, temps) {
    const g = this.ctx, T = this.taille * echelle;

      const coul = { ligneH: "#ff8c42", ligneV: "#ff8c42", bombe: "#e2483d", couleur: "#9b5de5", cloche: "#3aa89e" }[p.special];
      g.fillStyle = coul; g.globalAlpha = alpha * 0.85;
      this.rectArrondi(-T*.44, -T*.44, T*.88, T*.88, T*.22); g.fill();
      g.globalAlpha = alpha;
      g.strokeStyle = "#fff"; g.lineWidth = 2; g.stroke();
      if (p.special === "ligneH" || p.special === "ligneV") { // flèches
        g.fillStyle = "#fff";
        g.save(); if (p.special === "ligneV") g.rotate(Math.PI/2);
        for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s*T*.42, 0); g.lineTo(s*T*.30, -T*.09); g.lineTo(s*T*.30, T*.09); g.fill(); }

    g.textAlign = "center"; g.textBaseline = "middle";

    if (p.plat && Visuels.obstacle("plat")) { const s = T * .86; g.drawImage(Visuels.obstacle("plat"), -s/2, -s/2, s, s); g.restore(); return; }

    if (img) { const s = T * (p.special ? .66 : .86); g.drawImage(img, -s/2, -s/2, s, s); }   // PNG 512 réduit
    else g.fillText(emoji, 0, T * .04);                                                       // repli emoji

      g.fillText(POWERUPS[p.special].emoji, T*.24, -T*.24);

  dessinerHUD() {
    const g = this.ctx, K = CONFIG.couleurs, j = this.jeu;
    g.fillStyle = K.hud; this.rectArrondi(10, 12, this.w - 20, 116, 20); g.fill();
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = K.texte;
    g.font = "bold 18px Trebuchet MS"; g.fillText("👨‍🍳 Chef Match – " + (j.niveau.id === "demo" ? "Démo bloqueurs" : "Niveau " + j.niveau.id), this.w/2, 32);
