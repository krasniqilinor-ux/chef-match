/* =====================================================================
 * 5. INPUT – Pointer Events (souris + tactile) : swipe et tap-tap
 * ===================================================================== */
class Input {
  constructor(canvas, jeu) {
    this.jeu = jeu; this.depart = null;
    const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    canvas.addEventListener("pointerdown", e => {
      jeu.effacerIndiceAuto();                          // tout appui efface l'indice et relance le délai
      if (jeu.rush) { jeu.rush.passer = true; return; } // tap = passer le Sweet Rush
      if (!jeu.peutJouer()) return;
      canvas.setPointerCapture(e.pointerId);
      const p = pos(e), cs = jeu.renderer.caseDepuisPoint(p.x, p.y);
      this.depart = cs ? { ...p, cs, swipe: false } : null;
    });
    canvas.addEventListener("pointermove", e => {
      if (!this.depart || this.depart.swipe || !jeu.peutJouer()) return;
      const p = pos(e), dx = p.x - this.depart.x, dy = p.y - this.depart.y;
      const seuil = jeu.renderer.taille * CONFIG.seuilSwipe;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < seuil) return;
      this.depart.swipe = true;
      const a = this.depart.cs;
      const b = Math.abs(dx) > Math.abs(dy) ? { r: a.r, c: a.c + Math.sign(dx) } : { r: a.r + Math.sign(dy), c: a.c };
      jeu.selection = null;
      if (jeu.board.jouable(b.r, b.c)) jeu.jouerEchange(a, b);
    });
    canvas.addEventListener("pointerup", () => {
      if (this.depart && !this.depart.swipe && jeu.peutJouer()) this.tap(this.depart.cs);
      this.depart = null;
    });
    canvas.addEventListener("pointercancel", () => { this.depart = null; });
  }
  tap(cs) {
    const j = this.jeu, s = j.selection;
    if (j.debug.placer) { j.debugPoserSpecial(cs, j.debug.placer); return; }
    // Double-tap sur un power-up : activation sur place (compte comme un coup)
    const p = j.board.get(cs.r, cs.c), now = performance.now(), d = this.dernierTap;
    this.dernierTap = { r: cs.r, c: cs.c, t: now };
    if (p && p.special && d && d.r === cs.r && d.c === cs.c && now - d.t < 400 && !j.tutoCoup) {
      this.dernierTap = null; j.selection = null; j.activerPowerUp(cs); return;
    }
    if (!s) { j.selection = cs; return; }
    if (s.r === cs.r && s.c === cs.c) { j.selection = null; return; }
    if (Math.abs(s.r - cs.r) + Math.abs(s.c - cs.c) === 1) { j.selection = null; j.jouerEchange(s, cs); }
    else j.selection = cs;
  }
}

/* =====================================================================
 * 6. GAME – machine à états + orchestration logique / animations
 * ===================================================================== */
const ETAT = { IDLE: "IDLE", SWAPPING: "SWAPPING", RESOLVING: "RESOLVING", FALLING: "FALLING", END: "END" };

class Game {
  constructor(canvas, indexNiveau = 0) {
    this.indexNiveau = indexNiveau; this.animator = new Animator();
    this.vues = new WeakMap(); this.fantomes = []; this.particules = []; this.cloches = [];
    this.debug = { vitesse: 1, placer: null }; this.fps = 60; this.sessions = [];
    this.demarrer();
    this.renderer = new Renderer(canvas, this);
    this.input = new Input(canvas, this);
    let dernier = performance.now();
    const boucle = (t) => {               // boucle requestAnimationFrame avec delta-time
      const dt = Math.min(50, t - dernier); dernier = t;
      this.animator.update(dt * this.debug.vitesse * (this.rush && this.rush.passer ? 8 : 1)); this.majParticules(dt);
      this.fps = this.fps * 0.9 + (1000 / Math.max(1, dt)) * 0.1;
      this.verifierIndiceAuto(t);
      this.renderer.dessiner(t);
      requestAnimationFrame(boucle);
    };
    requestAnimationFrame(boucle);
  }
  /** Lance le niveau NIVEAUX[index] (format MatchDesign). */
  demarrer(index = this.indexNiveau) {
    if (index !== "demo" && index !== -1 && NIVEAUX[index] && NIVEAUX[index].invalide) {   // niveau rejeté par la validation
      const N = NIVEAUX[index];
      if (typeof console !== "undefined") console.error(`[Niveaux] niveau ${N.id} non jouable : ` + N.invalide.map(e => e.code).join(", "));
      this.niveauRefuse = { id: N.id, erreurs: N.invalide };
      if (typeof document !== "undefined" && typeof Menu !== "undefined" && Menu.el && document.getElementById("grilleNiveaux")) Menu.ouvrir();
      return false;
    }
    this.niveauRefuse = null;
    // index -1 (ou "demo") = niveau de démonstration des bloqueurs
    if (index === "demo" || index === -1) this.indexNiveau = -1;
    else this.indexNiveau = Math.max(0, Math.min(NIVEAUX.length - 1, index));
    const N = this.niveau = this.indexNiveau < 0 ? NIVEAU_DEMO : NIVEAUX[this.indexNiveau];
    CONFIG.types = N.colors.map(k => PIECES[k] || "❓");     // type i = N.colors[i]
    CONFIG.cles = N.colors.slice();                          // type i -> id de pièce (= nom du PNG)
    const grid = N.grid || null;
    this.board = new Board(grid ? grid.length : 8, grid ? grid[0].length : 8, N.colors.length, Math.random, grid,
      N.blockers ? N.blockers.map(b => b.type === "stew_pot" ? { ...b, couleur: N.colors.indexOf(b.color) } : b) : null);
    this.board.vapeur = !!N.vapeur;   // v0.5 : vapeur des casseroles, par niveau
    this.coups = N.moves;
    // Objectifs : collect (v4) + blocker / deliver (v5). type = -100 pour les objectifs non-pièce.
    this.objectifs = N.goals.map(g => {
      if (g.type === "collect") return { genre: "collect", type: N.colors.indexOf(g.piece), cle: g.piece, restant: g.count, emoji: PIECES[g.piece] };
      if (g.type === "ragouts") g = { type: "blocker", blocker: "stew_pot", count: g.count };   // v0.5 : « Servir X ragoûts »
      if (g.type === "blocker" && BLOQUEURS[g.blocker]) return { genre: "bloqueur", type: -100, cle: g.blocker, tous: g.count == null,
        restant: g.count == null ? this.board.compterBloqueurs(g.blocker) : g.count, emoji: BLOQUEURS[g.blocker].emoji };
      if (g.type === "deliver") return { genre: "livraison", type: -100, cle: "plat", restant: g.count == null ? this.board.platsInit.length : g.count, emoji: PLAT.emoji };
      return null;
    }).filter(o => o && (o.genre !== "collect" || o.type >= 0));
    this.etat = ETAT.IDLE; this.selection = null; this.message = null; this.fantomes = [];
    this.vues = new WeakMap(); this.indice = null; this.tutoCoup = null; this.rush = null; this.puVus = new Set();
    // Tutoriel scripté : grille préparée + coup imposé surligné
    const tuto = N.tutorial && TUTOS[N.tutorial];
    if (tuto) { const coup = this.board.preparerTuto(tuto); if (coup) { this.indice = coup; this.tutoCoup = coup; } }
    this.afficherMessage(this.objectifs.map(o => this.texteObjectif(o)).join("\n"), 2200);
    this.log = new PlaytestLog(this); this.sessions.push(this.log.data);
    { const tu = N.tutorial ? N.tutorial : N.id === 31 ? "stew_pot_intro" : null;   // v0.5.1 : tutorial_shown
      if (tu && !N.demo) { this.log.evenement("tutorial_shown"); Object.assign(this.log.data.evenements[this.log.data.evenements.length - 1], { tutoriel: tu, niveau: N.id }); } }
    // v0.4-dev : boosters choisis à l'écran pré-niveau (aucun tirage aléatoire en plus si aucun booster)
    EcoLog.niveau = N.demo ? null : N.id;   // v0.5 : niveau courant des événements économie
    this.achatsPlus5 = 0;   // nouvelle partie : paliers +5 coups remis à zéro
    const bst = this.boostersEnAttente; this.boostersEnAttente = null; this.boostersUtilises = [];
    if (bst && bst.length && !tuto) {
      const ok = bst.filter(k => Economie.utiliserBooster(k, { niveau: N.id }));
      this.boostersUtilises = this.board.poserBoosters(ok);
      if (ok.length) { this.log.evenement("boosters_pre_niveau"); Object.assign(this.log.data.evenements[this.log.data.evenements.length - 1], { boosters: ok }); }
    }
    this.board.grille.forEach((ligne, r) => ligne.forEach((p, c) => { if (!p) return; const v = this.vue(p); v.x = c; v.y = r; }));
    if (this.renderer) this.renderer.redimensionner();
  }
  texteObjectif(o) {
    if (o.genre === "bloqueur" && o.cle === "stew_pot") return txt("goal.ragouts", { count: o.restant });
    if (o.genre === "bloqueur") return txt(o.tous ? "goal.blocker.all" : "goal.blocker", { count: o.restant, blocker: BLOQUEURS[o.cle].nom });
    if (o.genre === "livraison") return txt("goal.deliver", { count: o.restant, plats: PLAT.nom });
    return txt("goal.collect", { count: o.restant, piece: txt("piece." + o.cle) });
  }
  /** Types de pièces encore à collecter / bloqueurs encore à éliminer (pour l'indice, la cloche et le bot). */
  typesObjectifs() { return this.objectifs.filter(o => o.restant > 0 && o.genre !== "bloqueur" && o.genre !== "livraison").map(o => o.type); }
  bloqueursObjectifs() { return this.objectifs.filter(o => o.restant > 0 && (o.genre === "bloqueur" || o.genre === "livraison")).map(o => o.genre === "livraison" ? "plat" : o.cle); }
  /** Objectifs « tous » (sans count) : recalculés sur le plateau. */
  majObjectifsDynamiques() { this.objectifs.forEach(o => { if (o.tous) o.restant = this.board.compterBloqueurs(o.cle); }); }
  /** État visuel d'une pièce (créé à la volée). */
  vue(p) {
    if (!this.vues.has(p)) this.vues.set(p, { x: 0, y: 0, echelle: 1, alpha: 1 });
    return this.vues.get(p);
  }
  /** Bandeau temporaire au centre du plateau. */
  afficherMessage(m, ms = 1400) {
    if (this.message !== m) { this.msgVue = { e: 0.4 }; this.animator.tween(this.msgVue, { e: 1 }, 260, Easing.sortieBack); }
    this.message = m; clearTimeout(this._tMsg);
    if (ms) this._tMsg = setTimeout(() => { if (this.message === m) this.message = null; }, ms);
  }
  peutJouer() { return this.etat === ETAT.IDLE; }
  changerEtat(e) {
    if (e === ETAT.IDLE && this.etat !== ETAT.IDLE) this.idleDepuis = performance.now();  // relance le délai d'indice
    if (e !== ETAT.IDLE) this.indiceAuto = null;
    this.etat = e;
  }

  /* ---------- Indice automatique après 5 s d'inactivité ---------- */
  effacerIndiceAuto() { this.indiceAuto = null; this.idleDepuis = performance.now(); this.indiceEvalue = false; }
  indiceAutorise() {
    if (this.etat !== ETAT.IDLE || this.tutoCoup || this.rush || this.animator.actif) return false;
    if (typeof document !== "undefined" && ["overlay", "ecranNiveaux", "intro"].some(id => { const el = document.getElementById(id); return el && el.classList.contains("show"); })) return false;
    return true;
  }
  verifierIndiceAuto(t) {
    // Hors IDLE « libre » (animations, rush, tuto, écrans) : pas d'indice et le délai repart de zéro
    if (!this.indiceAutorise()) { this.indiceAuto = null; this.idleDepuis = t; this.indiceEvalue = false; return; }
    if (this.indiceAuto || this.indiceEvalue || t - (this.idleDepuis || t) < CONFIG.delaiIndice) return;
    // Règle v0.2.6 : indice UNIQUEMENT quand il reste <= 3 coups (compteur), après 15 s d'inactivité
    if (this.coups > CONFIG.indiceCoupsMax) return;
    const coup = this.board.meilleurCoup(this.typesObjectifs(), this.bloqueursObjectifs());
    if (!coup) return;
    this.indiceAuto = coup;
    this.log.evenement("hint_shown");
    Object.assign(this.log.data.evenements[this.log.data.evenements.length - 1], { type: coup.type, cellules: coup.cellules.map(x => [x.r, x.c]) });
    this.log.sauver();
  }

  /** Activation d'un power-up par double-tap (sans échange) : compte comme un coup. */
  async activerPowerUp(cs) {
    const p = this.board.get(cs.r, cs.c);
    if (!this.peutJouer() || !p || !p.special || !this.board.peutActiver(cs.r, cs.c)) return;
    this.changerEtat(ETAT.RESOLVING);
    this.board.casseroleTouchee = false; this.board.debutCoup();
    this.log.coup(cs, cs, p, p);
    const dernier = this.log.data.coups[this.log.data.coups.length - 1]; dernier.doubleTap = true; dernier.coupPossibleAvant = true;
    this.log.evenement("double_tap_activation");
    Object.assign(this.log.data.evenements[this.log.data.evenements.length - 1], { special: p.special, cellule: [cs.r, cs.c] });
    this.coups--;
    await this.executerEffacement([cs]);
    await this.faireTomber();
    await this.boucleCascades();
    this.finDeCoup();
  }

  /** Point d'entrée d'un coup joueur. */
  async jouerEchange(a, b) {
    if (!this.peutJouer()) return;
    const B = this.board, D = CONFIG.durees;
    const pa = B.get(a.r, a.c), pb = B.get(b.r, b.c);
    // v0.3.4 : pièce sous glace/chaîne ou obstacle de case -> secousse + cadenas, loggé à part
    if (B.jouable(a.r, a.c) && B.jouable(b.r, b.c) && (B.fixe(a.r, a.c) || B.fixe(b.r, b.c))) {
      const cible = B.fixe(a.r, a.c) ? a : b;
      this.verrou = { r: cible.r, c: cible.c, t: performance.now() };
      this.log.bloque(a, b);
      return;
    }
    if (!pa || !pb) return;
    // Tutoriel : seul le coup surligné est accepté au premier coup
    const T = this.tutoCoup, estTuto = T && ((T.a.r===a.r&&T.a.c===a.c&&T.b.r===b.r&&T.b.c===b.c) || (T.a.r===b.r&&T.a.c===b.c&&T.b.r===a.r&&T.b.c===a.c));
    this.changerEtat(ETAT.SWAPPING);
    if (!T) this.indice = null;
    const va = this.vue(pa), vb = this.vue(pb);
    // Animation d'échange
    await Promise.all([this.animator.tween(va, { x: b.c, y: b.r }, D.swap), this.animator.tween(vb, { x: a.c, y: a.r }, D.swap)]);
    if (!B.echangeValide(a, b) || (T && !estTuto)) {
      // Échange invalide : retour avec rebond
      await Promise.all([this.animator.tween(va, { x: a.c, y: a.r }, D.rebond * 1.5, Easing.sortieBack),
                         this.animator.tween(vb, { x: b.c, y: b.r }, D.rebond * 1.5, Easing.sortieBack)]);
      this.log.invalide(a, b);
      this.changerEtat(ETAT.IDLE); return;
    }
    this.log.coup(a, b, pa, pb);
    this.log.data.coups[this.log.data.coups.length - 1].coupPossibleAvant = true; // le coup joué était valide
    if (T) { this.tutoCoup = null; this.indice = null; }
    B.echanger(a, b);
    this.coups--;
    B.casseroleTouchee = false; B.debutCoup();
    this.changerEtat(ETAT.RESOLVING);
    // Après l'échange : pa est en b, pb est en a
    await this.resoudreEchange(b, pa, a, pb);
    await this.boucleCascades([a, b]);
    this.finDeCoup();
  }

  /** Gère l'activation des specials par échange (avant les matches classiques). */
  async resoudreEchange(posA, pa, posB, pb) {
    const B = this.board, ca = categorie(pa.special), cb = categorie(pb.special);
    if (!ca && !cb) return;
    const cles = new Map(), initiales = [], k = p => p.r * B.C + p.c;
    const ajouterZone = (r0, r1, c0, c1) => { for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (B.jouable(r, c)) initiales.push({ r, c }); };
    const P = posA;   // centre des combos = case où arrive la pièce déplacée
    let combo = null;
    if (ca === "star" && cb === "star") {
      // Étoile + Étoile : tout le plateau
      combo = "star_star"; pa.special = null; pb.special = null; ajouterZone(0, B.L - 1, 0, B.C - 1);
    } else if (ca === "star" || cb === "star") {
      const [posS, st, posO, autre] = ca === "star" ? [posA, pa, posB, pb] : [posB, pb, posA, pa];
      if (!autre.special) { cles.set(k(posS), autre.type); initiales.push(posS); }   // Étoile + pièce : sa couleur
      else {
        // Étoile + power-up : la couleur la plus fréquente devient ce power-up, puis tout se déclenche
        combo = "star_" + categorie(autre.special); st.special = null;
        const t = B.typeMajoritaire();
        B.cases().forEach(({ r, c }) => { const p = B.grille[r][c];
          if (p && p.type === t && !p.special) {
            p.special = categorie(autre.special) === "knife" ? (B.rng() < .5 ? "ligneH" : "ligneV") : autre.special;
            initiales.push({ r, c }); } });
        initiales.push(posS, posO);
      }
    } else if (ca && cb) {
      combo = [ca, cb].sort().join("_");
      if (combo === "knife_knife") { pa.special = pb.special = null; ajouterZone(P.r, P.r, 0, B.C - 1); ajouterZone(0, B.L - 1, P.c, P.c); }
      else if (combo === "knife_pan") { pa.special = pb.special = null; ajouterZone(P.r - 1, P.r + 1, 0, B.C - 1); ajouterZone(0, B.L - 1, P.c - 1, P.c + 1); }
      else if (combo === "pan_pan") { pa.special = pb.special = null; ajouterZone(P.r - 2, P.r + 2, P.c - 2, P.c + 2); }
      else if (combo === "cloche_cloche") { pa.nbVols = 3; pb.special = null; }       // 3 cloches vers 3 cibles
      else { // cloche + couteau/poêle : la cloche emporte l'autre power-up jusqu'à sa cible
        const [cl, autre] = ca === "cloche" ? [pa, pb] : [pb, pa];
        cl.porte = autre.special; autre.special = null;
      }
      initiales.push(posA, posB);
    } else {
      // Un seul power-up échangé avec une pièce normale : il se déclenche
      if (pa.special) initiales.push(posA);
      if (pb.special) initiales.push(posB);
    }
    if (combo) {
      this.log.powerUp("actives", "combo_" + combo);
      const noms = { knife_knife: "Croix", knife_pan: "Super croix", pan_pan: "Méga explosion", cloche_knife: "Cloche + Couteau",
        cloche_pan: "Cloche + Poêle", cloche_cloche: "Triple cloche", star_star: "Grand nettoyage" };
      this.afficherMessage("✨ Combo : " + (noms[combo] || "Étoile + " + combo.split("_")[1]) + " !", 1000);
    }
    this.derniereCombo = combo;
    // Les matches classiques éventuels sont traités par la boucle de cascades ensuite
    await this.executerEffacement(initiales, [], cles);
    await this.faireTomber();
  }

  /** Boucle : matches -> effacement -> gravité -> remplissage, jusqu'à stabilité. */
  async boucleCascades(casesEchangees = []) {
    let premier = true;
    while (true) {
      const groupes = this.board.trouverMatches();
      if (groupes.length === 0) break;
      this.changerEtat(ETAT.RESOLVING);
      const { cases, creations } = this.board.analyserMatches(groupes, premier ? casesEchangees : []);
      await this.executerEffacement(cases, creations, new Map(), { match: true });
      await this.faireTomber();
      premier = false;
    }
  }

  /** Efface (logique) puis anime pop + particules, compte les objectifs. */
  async executerEffacement(cases, creations = [], cles = new Map(), opts = {}) {
    const { effacees, crees, vols, bloqueurs } = this.board.effacer(cases, creations, cles, opts);
    // v0.3 : bloqueurs détruits -> objectifs ; PV perdus -> petit éclat
    (bloqueurs || []).forEach(e => {
      if (e.detruit) { const o = this.objectifs.find(o => o.genre === "bloqueur" && o.cle === e.type && !o.tous); if (o && o.restant > 0) o.restant--; }
      if (this.log && this.log.powerUp) this.log.powerUp("bloqueurs", e.type + (e.detruit ? "_detruit" : "_pv"));
      this.eclat(e.r, e.c, e.type === "glace" ? "#bfe6ff" : e.type === "nappe" ? "#e25656" : "#d9c2a0");
    });
    if (bloqueurs && bloqueurs.length) this.majObjectifsDynamiques();
    crees.forEach(({ piece }) => {
      if (this.rush) { this.rush.crees[piece.special] = (this.rush.crees[piece.special] || 0) + 1; return; }   // comptés à part
      this.log.powerUp("crees", piece.special);
      const cle = POWERUPS[piece.special].cle;   // 1re apparition dans la partie : nom + description
      if (!this.puVus.has(cle)) { this.puVus.add(cle); this.afficherMessage(txt("powerup." + cle) + "\n" + txt("powerup." + cle + ".desc"), 1600); }
    });
    effacees.forEach(({ piece, remplacee }) => {
      if (piece.special && !remplacee) this.log.powerUp("actives", piece.special);
      const o = this.objectifs.find(o => o.type === piece.type && !piece.special || o.type === piece.type && piece.special && piece.special !== "couleur");
      if (o && o.restant > 0) o.restant--;
      this.fantomes.push(piece);
    });
    const anims = effacees.map(({ piece }) => this.animerDisparition(piece));
    crees.forEach(({ r, c, piece }) => {
      const v = this.vue(piece); v.x = c; v.y = r; v.echelle = 0.2;
      anims.push(this.animator.tween(v, { echelle: 1 }, CONFIG.durees.pop * 1.4, Easing.sortieBack));
    });
    await Promise.all(anims);
    this.fantomes = [];
    if (vols.length) await this.traiterVols(vols);
  }

  /** Envol des cloches : animation vers la cible, puis effacement (avec power-up porté éventuel). */
  async traiterVols(vols) {
    const B = this.board, types = this.typesObjectifs(), blocs = this.bloqueursObjectifs(), exclus = new Set(), cibles = [];
    await Promise.all(vols.map(v => {
      const cible = B.choisirCible(v, types, exclus, blocs);
      if (!cible) return Promise.resolve();
      exclus.add(cible.r * B.C + cible.c); cibles.push({ ...cible, porte: v.porte });
      const sprite = { x: v.c, y: v.r, echelle: 1, porte: v.porte };
      this.cloches.push(sprite);
      this.log.powerUp("vols", "cloche");
      return this.animator.tween(sprite, { echelle: 1.5 }, 120, Easing.sortieQuad)
        .then(() => this.animator.tween(sprite, { x: cible.c, y: cible.r, echelle: 1 }, 380, Easing.sortieQuad))
        .then(() => { this.cloches = this.cloches.filter(s => s !== sprite); });
    }));
    cibles.forEach(c => { const p = B.grille[c.r][c.c]; if (p && c.porte && !p.plat) p.special = c.porte; });
    this.dernieresCibles = cibles;
    if (cibles.length) await this.executerEffacement(cibles);
  }
  /** Particules sur une case (dégât de bloqueur). */
  /**
   * v0.5 : marmite servie -> anim ArtStory à sa place ; à la frame 4 les 3 vraies pièces (déjà posées par le moteur)
   * s'envolent de la marmite vers leurs cases (tween CONFIG_BURST.volMs) ; l'ancienne pièce reste visible jusqu'à l'arrivée.
   * figerA (ms, debug/capture) : fige l'animation à cet instant.
   */
  animerRagouts(servis, typesAvant = null, figerA = null) {
    this.bursts = this.bursts || [];
    const dep = Burst.debutFrame(CONFIG_BURST.frameDepart), D = CONFIG_BURST.volMs, lin = x => x, proms = [];
    servis.forEach(s => {
      const b = { r: s.depuis.r, c: s.depuis.c, ms: 0, couleur: s.couleur }; this.bursts.push(b);
      if (figerA != null) b.ms = figerA;
      else proms.push(this.animator.tween(b, { ms: Burst.total() }, Burst.total(), lin).then(() => { this.bursts = this.bursts.filter(x => x !== b); }));
      s.cases.forEach(x => {
        const p = this.board.grille[x.r][x.c]; if (!p) return;
        const v = this.vue(p), ancien = typesAvant && typesAvant[x.r] && typesAvant[x.r][x.c];
        let f = null; if (ancien != null && ancien !== p.type) { f = creerPiece(ancien); const vf = this.vue(f); vf.x = x.c; vf.y = x.r; this.fantomes.push(f); }
        if (figerA != null) { const k = Math.max(0, Math.min(1, (figerA - dep) / D));
          Object.assign(v, { x: b.c + (x.c - b.c) * k, y: b.r + (x.r - b.r) * k, echelle: .6 + .4 * k, alpha: figerA >= dep ? 1 : 0 }); return; }
        Object.assign(v, { x: b.c, y: b.r, echelle: .6, alpha: 0 });
        proms.push(this.animator.tween(v, { alpha: 1 }, 40, lin, dep),
          this.animator.tween(v, { x: x.c, y: x.r, echelle: 1 }, D, Easing.sortieQuad, dep).then(() => {
            v.x = x.c; v.y = x.r; v.echelle = 1; v.alpha = 1; this.eclat(x.r, x.c, "#ffb347");
            if (f) this.fantomes = this.fantomes.filter(q => q !== f); }));
      });
    });
    return Promise.all(proms);
  }
  eclat(r, c, couleur) {
    const R = this.renderer; if (!R) return;
    for (let i = 0; i < 6; i++) this.particules.push({ x: R.ox + (c + .5) * R.taille, y: R.oy + (r + .5) * R.taille,
      vx: (Math.random() - .5) * .5, vy: (Math.random() - .8) * .5, vie: 1, taille: 2 + Math.random() * 3, couleur });
  }
  animerDisparition(piece) {
    const v = this.vue(piece), R = this.renderer;
    if (R) for (let i = 0; i < 5; i++) this.particules.push({
      x: R.ox + (v.x + .5) * R.taille, y: R.oy + (v.y + .5) * R.taille,
      vx: (Math.random() - .5) * .4, vy: (Math.random() - .8) * .4, vie: 1, taille: 2 + Math.random() * 3,
      couleur: ["#ffb347", "#ff7b54", "#ffd56b", "#fff"][i % 4] });
    return this.animator.tween(v, { echelle: 1.3, alpha: 0 }, CONFIG.durees.pop, Easing.entreeQuad);
  }
  majParticules(dt) {
    this.particules = this.particules.filter(p => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.0008 * dt; p.vie -= dt / 500; return p.vie > 0;
    });
  }
  /** Gravité + remplissage animés (easing avec rebond). */
  async faireTomber() {
    this.changerEtat(ETAT.FALLING);
    const chute = () => Promise.all([...this.board.appliquerGravite(), ...this.board.remplir()].map(m => {
      const v = this.vue(m.piece); v.x = m.c;
      if (m.deR < 0) { v.y = m.deR; v.echelle = 1; v.alpha = 1; }
      const dist = m.versR - v.y;
      return this.animator.tween(v, { y: m.versR }, 120 + CONFIG.durees.chuteParCase * dist, Easing.sortieRebond);
    }));
    await chute();
    // v0.3 : livraison des plats arrivés en bas, puis nouvelle chute
    let sortis, garde = 0;
    while ((sortis = this.board.collecterPlats()).length && garde++ < 20) {
      sortis.forEach(({ piece, r, c }) => {
        const o = this.objectifs.find(o => o.genre === "livraison"); if (o && o.restant > 0) o.restant--;
        if (this.log && this.log.powerUp) this.log.powerUp("livraisons", "plat");
        if (this.log && this.log.livraison) this.log.livraison(r, c);
        this.fantomes.push(piece);
      });
      await Promise.all(sortis.map(({ piece }) => this.animator.tween(this.vue(piece), { y: this.vue(piece).y + 1, alpha: 0 }, 260, Easing.entreeQuad)));
      this.fantomes = [];
      await chute();
    }
    this.changerEtat(ETAT.RESOLVING);
  }

  /** Après stabilisation : victoire, défaite, mélange ou retour à IDLE. */
  async finDeCoup() {
    // Victoire vérifiée après stabilisation des cascades, puis bonus de fin
    if (this.objectifs.every(o => o.restant === 0)) {
      this.coupsAvantRush = this.coups;      // meilleur résultat = coups restants AVANT le bonus
      if (this.log && this.log.data) this.log.data.coupsRestantsObjectif = this.coups;   // v0.5.1 : avant Sweet Rush
      { const av = this.board.grille.map(l => l.map(p => p ? p.type : null)), sv = this.board.servirRagouts ? this.board.servirRagouts() : [];   // v0.5.1
        sv.forEach(() => { if (this.log && this.log.evenement) this.log.evenement("ragout_servi"); });
        if (sv.length && this.animerRagouts) await this.animerRagouts(sv, av); }
      await this.sweetRush(); return this.terminer(true);
    }
    // v0.5 : ragoûts servis -> projection de 3 pièces ; vapeur -> glace légère
    const typesAvant = this.board.grille.map(l => l.map(p => p ? p.type : null));   // rendu seulement : pièces remplacées
    const servis = this.board.servirRagouts ? this.board.servirRagouts() : [];
    servis.forEach(s => { if (this.log && this.log.evenement) this.log.evenement("ragout_servi"); });
    if (servis.length) await this.animerRagouts(servis, typesAvant);
    const vap = this.board.vapeurFinCoup ? this.board.vapeurFinCoup() : [];
    if (vap.length) { this.majObjectifsDynamiques(); vap.forEach(v => this.eclat(v.r, v.c, "#cfeaff")); if (this.log && this.log.evenement) this.log.evenement("vapeur_glace"); }
    // v0.3 : casseroles non touchées pendant le coup -> débordement sur une pièce voisine
    const deb = this.board.propagerCasseroles();
    if (deb) {
      this.majObjectifsDynamiques(); this.eclat(deb.r, deb.c, "#9aa4ad");
      if (this.log && this.log.evenement) this.log.evenement("casserole_propagation");
    }
    if (this.coups <= 0) return this.terminer(false);
    const possible = this.board.aUnCoupPossible();
    const dernier = this.log.data.coups[this.log.data.coups.length - 1];
    if (dernier) { dernier.coupPossibleApres = possible; dernier.melange = !possible; this.log.sauver(); }
    if (!possible) await this.melangerSiBesoin("apres_cascades");
    this.changerEtat(ETAT.IDLE);
  }
  /** Replace visuellement toutes les pièces à leur case logique. */
  animerPositions() {
    return Promise.all(this.board.cases().filter(({ r, c }) => this.board.grille[r][c])
      .map(({ r, c }) => this.animator.tween(this.vue(this.board.grille[r][c]), { x: c, y: r }, 400)));
  }

  /**
   * Bonus de fin « Sweet Rush » : chaque coup restant transforme une pièce
   * aléatoire en Couteau/Poêle, puis tous explosent en séquence. Tap = accélérer.
   */
  async sweetRush() {
    if (!BONUS_FIN.actif || this.coups <= 0) return;
    this.changerEtat(ETAT.RESOLVING);
    this.rush = { passer: false, transformes: 0, declenches: 0, crees: {} };
    const pause = ms => this.rush.passer ? Promise.resolve() : attendre(ms);
    this.afficherMessage("✨ Sweet Rush ! ✨\n(touche pour passer)", 1200);
    await pause(700);
    const B = this.board;
    while (this.coups > 0) {
      const libres = B.cases().filter(({ r, c }) => B.grille[r][c] && !B.grille[r][c].special && !B.grille[r][c].plat && !B.fixe(r, c));
      if (!libres.length) break;
      const { r, c } = libres[Math.floor(Math.random() * libres.length)];
      const p = B.grille[r][c];
      p.special = BONUS_FIN.types[Math.floor(Math.random() * BONUS_FIN.types.length)];
      this.coups--; this.rush.transformes++;
      const v = this.vue(p); v.echelle = 0.3;
      this.animator.tween(v, { echelle: 1 }, 220, Easing.sortieBack);
      await pause(110);
    }
    await pause(300);
    // Déclenchement en séquence jusqu'à ce qu'il ne reste plus aucun special ligne/bombe
    let garde = 0;
    while (garde++ < 200) {
      const sp = B.cases().find(({ r, c }) => B.grille[r][c] && B.grille[r][c].special && B.grille[r][c].special !== "couleur");
      if (!sp) break;
      // Explosions enchaînées sans attendre la gravité (rythme rapide), chute groupée ensuite
      this.rush.declenches++;
      await this.executerEffacement([sp]);
      await pause(40);
      const reste = B.cases().some(({ r, c }) => B.grille[r][c] && B.grille[r][c].special && B.grille[r][c].special !== "couleur");
      if (!reste) { await this.faireTomber(); await this.boucleCascades(); }
    }
    if (!B.estPleine()) { await this.faireTomber(); await this.boucleCascades(); }
    this.log.data.sweetRush = { transformes: this.rush.transformes, declenchements: this.rush.declenches, passe: this.rush.passer, crees: this.rush.crees };
    this.rush = null;
  }

  /**
   * Vérifie qu'un coup existe ; sinon mélange animé (bandeau « Mélange ! ») + événement log.
   * Board.melanger() garantit : aucun match créé + au moins un coup (sinon nouvelle grille).
   */
  async melangerSiBesoin(raison, force = false) {
    if (!force && this.board.aUnCoupPossible()) return false;
    const etat = this.etat; this.changerEtat(ETAT.RESOLVING);
    this.log.evenement("melange");
    this.log.data.evenements[this.log.data.evenements.length - 1].raison = raison;
    this.afficherMessage("🔀 " + (TEXTES["shuffle"] || TEXTES["board.shuffle"] || "Mélange !"), 0);
    await attendre(650 / this.debug.vitesse);
    const regen = !this.board.melanger();
    if (regen) this.log.evenement("melange_regeneration");
    this.board.cases().forEach(({ r, c }) => { const p = this.board.grille[r][c]; if (p && !this.vues.has(p)) { const v = this.vue(p); v.x = c; v.y = -1; } });
    await this.animerPositions();
    this.message = null;
    this.changerEtat(etat === ETAT.END ? ETAT.END : ETAT.IDLE);
    return true;
  }

  terminer(victoire) {
    this.changerEtat(ETAT.END);
    this.log.fin(victoire ? "victoire" : "defaite");
    if (victoire) this.log.data.coupsRestantsAvantBonus = this.coupsAvantRush;
    const demo = !!(this.niveau && this.niveau.demo);   // v0.5 : niveaux de démo = aucune progression ni récompense
    const dejaGagne = !demo && this.indexNiveau >= 0 && ((Progres.lire().meilleurs[this.niveau.id] || {}).victoires || 0) > 0;
    if (this.indexNiveau >= 0 && !demo) Progres.enregistrer(this.indexNiveau, this.niveau.id, victoire, victoire ? this.coupsAvantRush : 0);
    this.soldeAvant = { or: Economie.or(), etoiles: Economie.etoiles() };
    this.etoilesGagnees = victoire && this.indexNiveau >= 0 && !demo && !dejaGagne ? Economie.gagnerEtoilesNiveau(this.niveau.id) : 0;
    this.orGagne = victoire && this.indexNiveau >= 0 && !demo ? Economie.orVictoire(this.coupsAvantRush, dejaGagne) : 0;
    if (victoire && this.indexNiveau >= 0 && !demo) EcoLog.noterVictoire(this.niveau.id);   // v0.5.1
    if (!victoire && this.indexNiveau >= 0 && !demo) this.vie = Vies.perdre(this.niveau.id);
    // v0.5 : échéance bancaire en cours -> une part de l'or de victoire est prélevée (jamais bloquant avant le niveau 100)
    this.banque = this.orGagne ? Banque.prelever(this.orGagne, "victoire_niveau_" + this.niveau.id) : null;
    if (this.orGagne - (this.banque ? this.banque.preleve : 0) > 0) Economie.ajouterOr(this.orGagne - (this.banque ? this.banque.preleve : 0), "victoire_niveau_" + this.niveau.id);
    if (typeof document !== "undefined" && document.getElementById("badgeRenover")) EcranRenovation.majBadge();
    UI.afficherFin(victoire, this);
  }
  /** Bouton « +5 coups » */
  async continuer() {
    // v0.3.1 : passe par le module Economie (gratuit pour l'instant, mais journalisé)
    const r = Economie.proposerOffre("plus5coups", { niveau: this.niveau.id, coupsJoues: this.log.data.coupsJoues, achatsPartie: this.achatsPlus5 || 0 });
    if (!r.accorde) { this.log.evenement("plus5_refuse"); return; }
    if (!r.gratuit) this.achatsPlus5 = (this.achatsPlus5 || 0) + 1;   // prix croissant dans la même partie
    this.log.evenement("plus5");
    Object.assign(this.log.data.evenements[this.log.data.evenements.length - 1], { offre: r.offre, gratuit: r.gratuit, prixOr: r.prixOr });
    this.coups += r.coups; UI.cacher(); this.changerEtat(ETAT.IDLE);
    await this.melangerSiBesoin("apres_plus5");   // FIX : la grille pouvait être bloquée au moment de la défaite
  }
  /** Session quittée sans résultat : « relance » si aucun coup joué, sinon « abandon ». */
  quitterSession() { if (this.log && !this.log.data.resultat) this.log.fin(this.log.data.coupsJoues === 0 ? "relance" : "abandon"); }
  rejouer() { this.quitterSession(); UI.cacher(); this.demarrer(); }
  niveauSuivant() { this.quitterSession(); UI.cacher(); this.demarrer((this.indexNiveau + 1) % NIVEAUX.length); }
  allerNiveau(i) { this.quitterSession(); UI.cacher(); this.demarrer(i); }

  /* ---------- Outils de debug ---------- */
  debugGagner() { if (this.etat !== ETAT.IDLE) return; this.log.evenement("debug_gagner");
    this.objectifs.forEach(o => o.restant = 0); this.finDeCoup(); }
  debugPerdre() { if (this.etat !== ETAT.IDLE) return; this.log.evenement("debug_perdre");
    this.coups = 0; this.terminer(false); }
  debugPlus5() { if (this.etat === ETAT.END) this.continuer(); else { this.coups += 5; this.log.evenement("debug_plus5"); if (this.etat === ETAT.IDLE) this.melangerSiBesoin("apres_debug"); } }
  async debugMelanger() {
    if (this.etat !== ETAT.IDLE) return; this.log.evenement("debug_melanger");
    await this.melangerSiBesoin("debug", true);
  }
  debugIndice() { this.indice = this.board.trouverCoupPossible(); }
  debugPoserSpecial(cs, special) {
    const p = this.board.get(cs.r, cs.c); if (!p || p.plat) return;
    if (special === "couleur") p.type = -1; else if (p.type < 0) p.type = this.board.typeAleatoire();
    p.special = special; this.debug.placer = null; this.log.evenement("debug_place_" + special);
    DebugUI.maj();
  }
}

/* =====================================================================
 * 6b. PLAYTEST LOG – toujours actif, une entrée par partie (session)
 * ===================================================================== */
class PlaytestLog {
  constructor(jeu) {
    this.jeu = jeu; this.dernier = performance.now();
    this.data = { version: VERSION, niveau: jeu.niveau.id, tutoriel: jeu.niveau.tutorial || null, targetWinRate: jeu.niveau.targetWinRate, debut: new Date().toISOString(),
      coupsJoues: 0, echangesInvalides: 0, echangesBloques: 0, tempsParCoupMs: [], coups: [],
      powerUps: { crees: {}, actives: {} }, evenements: [], resultat: null, coupsRestants: null, dureeMs: null };
    this.t0 = performance.now();
    this.data.sid = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
    this.sauver();
  }
  sauver() { Logs.sauver(this.data); }
  coup(a, b, pa, pb) {
    const t = performance.now(), d = Math.round(t - this.dernier); this.dernier = t;
    this.data.coupsJoues++; this.data.tempsParCoupMs.push(d);
    this.data.coups.push({ n: this.data.coupsJoues, de: [a.r, a.c], vers: [b.r, b.c], ms: d,
      specials: [pa.special, pb.special].filter(Boolean) });
    { const pl = this.positionsPlats(); if (pl) this.data.coups[this.data.coups.length - 1].plats = pl; }   // v0.4.1 : avant le coup
    this.sauver();
  }
  invalide() { this.data.echangesInvalides++; this.sauver(); }
  bloque() { this.data.echangesBloques = (this.data.echangesBloques || 0) + 1; this.sauver(); }
  powerUp(cat, type) { const o = this.data.powerUps[cat] = this.data.powerUps[cat] || {}; o[type] = (o[type] || 0) + 1; }
  /** v0.4.1 : livraison d'un plat (coup, case de départ) */
  livraison(r, c) { (this.data.livraisons = this.data.livraisons || []).push({ coup: this.data.coupsJoues, r, c, ms: Math.round(performance.now() - this.t0) }); }
  evenement(nom) { this.data.evenements.push({ nom, coup: this.data.coupsJoues, ms: Math.round(performance.now() - this.t0) }); this.sauver(); }
  /** v0.4.1 : onglet caché -> clôture provisoire « interrompu » (sauvée tout de suite). */
  cacher() { if (this.data.resultat) return; this.fin("interrompu"); this.data.provisoire = true; this.sauver(); }
  reprendre() {
    if (!this.data.provisoire) return;
    delete this.data.provisoire; this.data.resultat = null; this.data.coupsRestants = null; this.data.dureeMs = null; delete this.data.objectifsRestants;
    const ev = this.data.evenements; if (ev.length && ev[ev.length - 1].nom === "fin_interrompu") ev.pop();
    this.evenement("reprise");
  }
  /** v0.4.1 : plats sur le plateau [r, c, distance] (distance = cases mobiles sous le plat ; 0 = va être livré, 1 = avant-dernière rangée). */
  positionsPlats() {
    const B = this.jeu.board; if (!B || !B.platsInit || !B.platsInit.length) return null;
    return B.positionsPlats().map(({ r, c }) => { let d = 0; for (let y = r + 1; y < B.L; y++) if (B.jouable(y, c) && !B.fixe(y, c)) d++; return [r, c, d]; });
  }
  /** v0.5.1 : casseroles restantes [r, c, jauge, couleur] (null si aucune casserole dans le niveau). */
  jaugesCasseroles() {
    const B = this.jeu.board; if (!B || !B.bloc) return null; const l = [];
    for (let r = 0; r < B.L; r++) for (let c = 0; c < B.C; c++) { const b = B.bloc[r][c]; if (b && b.type === "stew_pot") l.push([r, c, b.jauge || 0, b.couleur]); }
    return l.length || (this.jeu.objectifs || []).some(o => o.cle === "stew_pot") ? l : null;
  }
  fin(resultat) {
    { const pl = this.positionsPlats(); if (pl) this.data.platsFin = pl; }
    { const cf = this.jaugesCasseroles(); if (cf) this.data.casserolesFin = cf; }   // v0.5.1
    if (this.data.provisoire && resultat !== "interrompu") { delete this.data.provisoire; const ev = this.data.evenements; if (ev.length && ev[ev.length - 1].nom === "fin_interrompu") ev.pop(); }
    this.evenement("fin_" + resultat);
    this.data.resultat = resultat; this.data.coupsRestants = this.jeu.coups;
    this.data.objectifsRestants = this.jeu.objectifs.map(o => ({ piece: o.cle, restant: o.restant }));
    this.data.dureeMs = Math.round(performance.now() - this.t0);
    const tps = this.data.tempsParCoupMs; this.data.tempsMoyenMs = tps.length ? Math.round(tps.reduce((x, y) => x + y, 0) / tps.length) : 0;
    this.sauver();
  }
}

/** Copie un texte dans le presse-papiers (avec repli execCommand pour file://). */
async function copierTexte(txt) {
  window.__dernierLogCopie = txt;
  try { await navigator.clipboard.writeText(txt); return true; } catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) {} ta.remove(); return ok;
  }
}

/* v0.4-dev : solde permanent (carte, rénovation, boutique, fin de niveau) + animation de gain */
const Solde = {
