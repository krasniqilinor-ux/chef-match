/* =====================================================================
 * 7b. DEBUG UI – ?debug=1 ou touche D
 * ===================================================================== */
const DebugUI = {
  init(jeu) {
    this.jeu = jeu; const el = this.el = document.getElementById("debug");
    if (/[?&]debug=1/.test(location.search)) el.classList.add("show");
    window.addEventListener("keydown", e => { if (e.key === "d" || e.key === "D") el.classList.toggle("show"); });
    document.getElementById("dbgTete").onclick = () => { el.classList.toggle("replie");
      document.getElementById("dbgFleche").textContent = el.classList.contains("replie") ? "▸" : "▾"; };
    el.querySelectorAll("button[data-a]").forEach(b => b.onclick = () => {
      const a = b.dataset.a;
      if (a === "gagner") jeu.debugGagner(); else if (a === "perdre") jeu.debugPerdre();
      else if (a === "plus5") jeu.debugPlus5(); else if (a === "melanger") jeu.debugMelanger();
      else if (a === "indice") jeu.debugIndice();
      else if (a === "ralenti") { jeu.debug.vitesse = jeu.debug.vitesse === 1 ? 0.25 : 1; this.maj(); }
      else if (a === "log") this.copierLog(b);
      else if (a === "effacerLogs") { Logs.effacer(); b.textContent = "✔ Logs effacés"; setTimeout(() => b.textContent = "🗑 Effacer les logs", 1200); }
      else if (a === "etoiles") { const e = Economie.lire(); e.etoiles += 3; Economie.ecrire(e); EcranRenovation.majBadge(); }
      else if (a === "resetReno") { Renovation.reset(); EcranRenovation.majBadge(); }
      else if (a === "toutDebloquer") { Progres.toutDebloquer(); Menu.construire(); }
      else if (a === "resetProgres") { Progres.reset(); Menu.construire(); }
    });
    el.querySelectorAll("button[data-p]").forEach(b => b.onclick = () => {
      jeu.debug.placer = jeu.debug.placer === b.dataset.p ? null : b.dataset.p; this.maj(); });
    const sel = document.getElementById("dbgNiveau");
    NIVEAUX.forEach((n, i) => { const o = document.createElement("option"); o.value = i;
      o.textContent = `N${n.id} · ${n.moves} coups${n.tutorial ? " · tuto " + n.tutorial : ""}`; sel.appendChild(o); });
    { const o = document.createElement("option"); o.value = -1; o.textContent = "🧪 Démo bloqueurs"; sel.appendChild(o); }
    sel.onchange = () => jeu.allerNiveau(+sel.value);
    setInterval(() => this.majStat(), 250); this.maj();
  },
  maj() {
    const j = this.jeu;
    document.getElementById("dbgRalenti").classList.toggle("on", j.debug.vitesse !== 1);
    this.el.querySelectorAll("button[data-p]").forEach(b => b.classList.toggle("on", j.debug.placer === b.dataset.p));
  },
  majStat() {
    const j = this.jeu, d = j.log.data;
    document.getElementById("dbgStat").textContent = `FPS ${Math.round(j.fps)} | ${j.etat}${j.rush ? " | RUSH" : ""}`;
    const sel = document.getElementById("dbgNiveau"); if (document.activeElement !== sel) sel.value = j.indexNiveau;
    document.getElementById("dbgInfo").textContent =
      `coups joués ${d.coupsJoues}  invalides ${d.echangesInvalides}  bloqués ${d.echangesBloques || 0}\ncréés ${JSON.stringify(d.powerUps.crees)}\nactivés ${JSON.stringify(d.powerUps.actives)}`;
  },
  async copierLog(btn) {
    const txt = JSON.stringify({ version: VERSION, stockage: Store.persistant ? "localStorage" : "mémoire", economie: Economie.lire(), sessions: Logs.tous() }, null, 2);
    const ok = await copierTexte(txt), ancien = btn.textContent;
    btn.textContent = ok ? "✔ Copié !" : "✖ Échec copie"; setTimeout(() => btn.textContent = ancien, 1200);
  }
};

/* =====================================================================
 * 7c. MENU DES NIVEAUX + INTRO HISTOIRE
 * ===================================================================== */
const Menu = {
  el: () => document.getElementById("ecranNiveaux"),
  construire() {
    const g = document.getElementById("grilleNiveaux"), p = Progres.lire(); g.innerHTML = "";
    NIVEAUX.forEach((n, i) => {
      const b = document.createElement("button"), ok = i < p.debloques, m = p.meilleurs[n.id];
      b.className = "carteNiv" + (ok ? "" : " verrou") + (m && m.victoires ? " gagne" : "");
      b.dataset.index = i; b.disabled = !ok;
      b.innerHTML = `<b>${ok ? "" : "🔒 "}Niveau ${n.id}</b><div class="obj">${n.goals.map(o => emojiObjectif(o) + "×" + (o.count ?? "tous")).join(" ")}</div>` +
        `<div class="best">${!ok ? "Verrouillé" : m && m.victoires ? "⭐ Meilleur : " + m.meilleursCoupsRestants + " coup(s) restant(s)" : n.moves + " coups · pas encore réussi"}</div>`;
      if (ok) b.onclick = () => this.choisir(i);
      g.appendChild(b);
    });
  },
  ouvrir() { this.construire(); UI.cacher(); this.el().classList.add("show"); },
  fermer() { this.el().classList.remove("show"); },
  choisir(i) {
    this.fermer();
    // L'intro n'est montrée qu'une fois, avant le niveau 1
    if (i === 0 && !Store.get(CLES.intro, false)) Intro.jouer(() => Menu.jeu.allerNiveau(0));
    else Menu.jeu.allerNiveau(i);
  }
};
const EcranRenovation = {
  el: () => document.getElementById("ecranRenovation"),
  majBadge() {
    const n = Renovation.abordables().length, b = document.getElementById("badgeRenover");
    b.textContent = n; b.classList.toggle("on", n > 0);
  },
  ouvrir() { UI.cacher(); this.construire(); this.el().classList.add("show"); },
  fermer() { this.el().classList.remove("show"); document.getElementById("renoBulle").classList.remove("show"); this.majBadge(); },
  construire(nouveau = null) {
    const lieu = Renovation.lieu(), s = Renovation.etat(), et = Economie.etoiles();
    document.getElementById("renoTitre").textContent = "🔨 " + lieu.nom;
    document.getElementById("renoEtoiles").textContent = "⭐ " + et;
    // Décor : avant -> après, opacité de « après » = tâches faites / nombre de tâches (fondu animé par CSS)
    const av = document.getElementById("renoAvant"), ap = document.getElementById("renoApres"), prog = s.faites.length / lieu.taches.length;
    av.style.backgroundImage = `url("${lieu.avant}")`; ap.style.backgroundImage = `url("${lieu.apres}")`;
    if (!nouveau) { ap.style.transition = "none"; ap.style.opacity = prog; void ap.offsetWidth; ap.style.transition = ""; }
    else { ap.style.opacity = prog; const e = document.getElementById("renoEclat"); e.classList.remove("go"); void e.offsetWidth; e.classList.add("go"); }
    // Overlays optionnels assets/task_<id>.png (si absents : rien, le fondu suffit)
    const ov = document.getElementById("renoOverlays"); ov.innerHTML = "";
    lieu.taches.filter(t => s.faites.includes(t.id) && t.image).forEach(t => { const im = document.createElement("img");
      im.className = "overlay" + (t.id === nouveau ? " nouveau" : ""); im.alt = ""; im.onerror = () => im.remove();
      im.style.left = t.pos[0] + "%"; im.style.top = t.pos[1] + "%"; im.style.width = t.pos[2] + "%";
      im.src = t.image; ov.appendChild(im); });
    document.getElementById("renoProgres").style.width = (100 * s.faites.length / lieu.taches.length) + "%";
    const liste = document.getElementById("renoListe"); liste.innerHTML = "";
    lieu.taches.forEach(t => { const b = document.createElement("button"), faite = s.faites.includes(t.id);
      b.className = "tache" + (faite ? " faite" : t.cout <= et ? " ok" : " cher");
      b.innerHTML = `<b>${t.emoji} ${t.nom}</b>${faite ? "✔ Terminé" : "⭐ " + t.cout}`;
      if (!faite) b.onclick = () => this.choisir(t.id); liste.appendChild(b); });
    const suiv = DATA_RENOVATION.lieux[DATA_RENOVATION.lieux.indexOf(lieu) + 1];
    document.getElementById("renoSuivant").textContent = suiv ? (Renovation.termine() ? "🔓 " : "🔒 ") + suiv.nom + " – " + (suiv.annonce || "") : "";
    this.majBadge();
  },
  choisir(id) {
    const r = Renovation.faire(id);
    if (!r.ok) { this.bulles([r.raison === "etoiles" ? `Il te manque ${r.manque} étoile(s) : gagne des niveaux !` : "Déjà fait !"]); return; }
    this.construire(id);
    const lignes = [...r.dialogue];
    if (r.fini) lignes.push(`🎁 Coffre de la terrasse : +${r.coffre.or} pièces d'or et ${r.coffre.nbBooster} ${POWERUPS[r.coffre.booster] ? POWERUPS[r.coffre.booster].emoji : ""} booster !`,
      r.suivant ? `✨ Prochain lieu : ${r.suivant.nom} (bientôt). ${r.suivant.annonce || ""}` : "", ...(r.suivant ? r.suivant.dialogue : []));
    setTimeout(() => this.bulles(lignes.filter(Boolean)), 1000);   // après le fondu
  },
  bulles(lignes) {
    const b = document.getElementById("renoBulle"); let i = 0;
    const montrer = () => { b.classList.remove("show"); void b.offsetWidth; b.innerHTML = lignes[i] + "<small>touche pour continuer</small>"; b.classList.add("show"); };
    b.onclick = () => { i++; if (i < lignes.length) montrer(); else b.classList.remove("show"); };
    montrer();
  }
};
const Intro = {
  cles: ["intro.1", "intro.2", "intro.3"],
  jouer(suite) {
    const el = document.getElementById("intro"), bulle = document.getElementById("bulle");
    let i = 0;
    const fin = () => { el.classList.remove("show"); el.onclick = null; Store.set(CLES.intro, true); suite(); };
    const montrer = () => { bulle.style.animation = "none"; void bulle.offsetWidth; bulle.style.animation = ""; bulle.textContent = txt(this.cles[i]); };
    el.onclick = () => { i++; if (i >= this.cles.length) fin(); else montrer(); };
    document.getElementById("btnPasser").onclick = e => { e.stopPropagation(); fin(); };
    montrer(); el.classList.add("show");
  }
};

if (typeof document !== "undefined" && document.getElementById("jeu")) {
  Visuels.charger();
  document.getElementById("btnRenover").onclick = () => EcranRenovation.ouvrir();
  document.getElementById("renoFermer").onclick = () => EcranRenovation.fermer();
  EcranRenovation.majBadge();
  // ?renovation=1 ouvre l'écran ; ?renovation=demo (debug) : 4 étoiles + 2 tâches faites, pour captures/playtest
  if (/[?&]renovation=demo/.test(location.search)) { const e = Economie.lire(); e.etoiles = 4; Economie.ecrire(e); Renovation.ecrire({ lieu: DATA_RENOVATION.lieux[0].id, faites: ["clean_floor", "fix_railing"], coffreRecu: false }); }
  if (/[?&]renovation=(1|demo)/.test(location.search)) EcranRenovation.ouvrir();
  const m = /[?&]niveau=(\d+|demo)/.exec(location.search);   // ?niveau=4 (niveau 4) ou ?niveau=demo (démo des bloqueurs)
  const jeu = new Game(document.getElementById("jeu"), !m ? 0 : m[1] === "demo" ? -1 : NIVEAUX.findIndex(n => n.id === +m[1]));
  document.getElementById("btnPlus5").onclick = () => jeu.continuer();
  document.getElementById("btnRejouer").onclick = () => jeu.rejouer();
  document.getElementById("btnSuivant").onclick = () => jeu.niveauSuivant();
  document.getElementById("btnLogFin").onclick = () => DebugUI.copierLog(document.getElementById("btnLogFin"));
  document.getElementById("btnNiveaux").onclick = () => Menu.ouvrir();
  document.getElementById("btnNiveauxFin").onclick = () => { jeu.quitterSession(); Menu.ouvrir(); };
  Menu.jeu = jeu;
  if (!m) Menu.ouvrir();          // écran de sélection au démarrage (sauf ?niveau=N)
  DebugUI.init(jeu);
  window.chefMatch = jeu; // accès debug depuis la console
  // v0.3.4 : fermeture/rechargement de l'onglet -> session close « interrompu » (+ durée) au lieu de null
  const interrompre = () => { if (jeu.log && !jeu.log.data.resultat) jeu.log.fin("interrompu"); };
  window.addEventListener("pagehide", interrompre); window.addEventListener("beforeunload", interrompre);
}
if (typeof module !== "undefined") module.exports = { Game, ETAT, categorie, Store, Logs, Progres, Board, creerPiece, creerPlat, CONFIG, NIVEAUX, NIVEAU_DEMO, BLOQUEURS, TYPE_PLAT, Economie, CONFIG_ECONOMIE, Visuels, IMAGES_OBSTACLES, Renovation, DATA_RENOVATION, RENOVATION_TERRASSE, TEXTES, PIECES, TUTOS, BONUS_FIN, txt };
